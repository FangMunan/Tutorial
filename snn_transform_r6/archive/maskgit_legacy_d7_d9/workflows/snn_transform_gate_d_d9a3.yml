name: SNN Transform Gate D9A.3 pair-residual consolidation audit

on:
  push:
    branches:
      - gate-d-plasticity-spectrum-audit
    paths:
      - 'snn_transform_r6/GATE_D9A3_PROTOCOL.md'
      - 'snn_transform_r6/gate_d_d9a3.py'
      - '.github/workflows/snn_transform_gate_d_d9a3.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  d9a3-pair-residual-consolidation:
    runs-on: ubuntu-24.04
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy torch scikit-learn scipy scikit-image matplotlib numba

      - name: Download frozen R6B1 SNN tokenizer
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_R6B1_TUNE_a075_t8
          path: snn_transform_r6/frozen_r6b1
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39139040624

      - name: Download exact R6B3 two-epoch checkpoint
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_R6B3_G2_TWO_EPOCHS
          path: snn_transform_r6/prior_g2
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39170815102

      - name: Download successful D7A artifact
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_GATE_D7A_SAFE_W2_TRAJECTORY_CLAMP
          path: snn_transform_r6/d7a_source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39871827217

      - name: Download successful D7A.2 artifact
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_GATE_D7A2_B2_BO_STOPPING_GATE
          path: snn_transform_r6/d7a2_source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39942308903

      - name: Download successful D8A artifact
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_GATE_D8A_FUNCTIONAL_MODE_IDENTIFICATION
          path: snn_transform_r6/d8a_source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39979543621

      - name: Download successful D8B artifact
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_GATE_D8B_CAUSAL_FUNCTIONAL_MODE
          path: snn_transform_r6/d8b_source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 40021397096

      - name: Download successful D9A.1 artifact
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_GATE_D9A1_PLASTIC_FUNCTIONAL_VELOCITY_AUDIT
          path: snn_transform_r6/d9a1_source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 40044084395

      - name: Download successful D9A.2-R artifact
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_GATE_D9A2R_MATCHED_TRAJECTORY_RELATIVE_GEOMETRY_COMPAT
          path: snn_transform_r6/d9a2r_source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 40094105097

      - name: Download MNIST
        working-directory: snn_transform_r6
        run: |
          mkdir -p run_gate_d9a3
          python - <<'PY'
          import urllib.request
          urllib.request.urlretrieve(
              'https://storage.googleapis.com/tensorflow/tf-keras-datasets/mnist.npz',
              'run_gate_d9a3/mnist.npz')
          PY

      - name: Static audit
        working-directory: snn_transform_r6
        env:
          PYTHONPATH: ../snn_transform_p3_image:.
        run: |
          set -euo pipefail
          python -m py_compile gate_d_d9a3.py gate_d_d9a1.py gate_d_d7a.py gate_d_d6a.py r6b4_full_forward_plasticity.py
          python - <<'PY'
          import pathlib
          p = pathlib.Path('GATE_D9A3_PROTOCOL.md').read_text(encoding='utf-8')
          src = pathlib.Path('gate_d_d9a3.py').read_text(encoding='utf-8')
          assert 'pair-versus-residual mode-consolidation decomposition' in p.lower()
          assert 'M1_PAIR_DRIVEN_CONSOLIDATION' in src
          assert 'M2_RESIDUAL_UNMASKING_CANCELLATION_RELEASE' in src
          assert 'M3_JOINT_CO_CONSOLIDATION' in src
          assert 'M4_PAIR_DOES_NOT_EXPLAIN_TRAJECTORY_CONSOLIDATION' in src
          assert "PAIR_FIELDS = ('b2', 'bo')" in src
          assert "'formal_transition_window': [128, 256]" in src
          assert "'controller_authorized': False" in src
          assert "'additional_block_search_authorized': False" in src
          print('D9A.3 import/static audit PASS')
          PY
          test -f d7a_source/result/D7A_SUMMARY.json
          test -f d7a_source/result/D7A_F_terminal.pkl
          test -f d7a_source/result/D7A_B_terminal.pkl
          test -f d7a_source/result/D7A_C_W2_safe_clamp_terminal.pkl
          test -f d7a2_source/result/D7A2_SUMMARY.json
          test -f d8a_source/result/D8A_SUMMARY.json
          test -f d8a_source/result/D8A_MODES.npz
          test -f d8b_source/result/D8B_SUMMARY.json
          test -f d9a1_source/result/D9A1_SUMMARY.json
          test -f d9a1_source/result/D9A1_VELOCITY_ARRAYS.npz
          test -f d9a2r_source/result/D9A2R_SUMMARY.json
          test -f d9a2r_source/result/D9A2R_ARRAYS.npz

      - name: Run Gate D9A.3
        working-directory: snn_transform_r6
        env:
          PYTHONPATH: ../snn_transform_p3_image:.
        run: |
          set -euo pipefail
          mkdir -p run_gate_d9a3/result
          python gate_d_d9a3.py \
            --data run_gate_d9a3/mnist.npz \
            --tokenizer frozen_r6b1/result/tokenizer.pt \
            --checkpoint prior_g2/result/checkpoint_2p0000epoch.pkl \
            --d7a-artifact d7a_source \
            --d7a2-artifact d7a2_source \
            --d8a-artifact d8a_source \
            --d8b-artifact d8b_source \
            --d9a1-artifact d9a1_source \
            --d9a2r-artifact d9a2r_source \
            --out run_gate_d9a3/result \
            --contexts 1024 --encode-batch 256 --seed 7311 --threads 4 \
            | tee run_gate_d9a3/console.log

      - name: Show compact D9A.3 result
        if: always()
        working-directory: snn_transform_r6
        run: |
          python - <<'PY'
          import json, pathlib
          f = pathlib.Path('run_gate_d9a3/result/D9A3_SUMMARY.json')
          if not f.exists():
              print('D9A3_SUMMARY.json not produced')
          else:
              d=json.load(open(f))
              print(json.dumps({
                  'classification': d.get('classification'),
                  'transition_128_256': d.get('transition_128_256'),
                  'checkpoint_decomposition': d.get('checkpoint_decomposition'),
                  'decision': d.get('decision'),
                  'trajectory_provenance': d.get('trajectory_provenance'),
              }, indent=2))
          PY

      - name: Upload Gate D9A.3 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SNN_TRANSFORM_GATE_D9A3_PAIR_RESIDUAL_CONSOLIDATION
          path: |
            snn_transform_r6/run_gate_d9a3/result/
            snn_transform_r6/run_gate_d9a3/console.log
          if-no-files-found: warn
          retention-days: 30

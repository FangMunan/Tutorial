name: SNN Transform Gate D7A.1 safe-W2 compensation map

on:
  push:
    branches:
      - gate-d-plasticity-spectrum-audit
    paths:
      - 'snn_transform_r6/gate_d_d7a1.py'
      - 'snn_transform_r6/gate_d_d7a1_same_run_w2.py'
      - 'snn_transform_r6/GATE_D7A1_PROTOCOL.md'
      - '.github/workflows/snn_transform_gate_d_d7a1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  d7a1-compensation-map:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy torch scikit-learn scipy scikit-image matplotlib numba

      - name: Download successful D6A artifact
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_GATE_D6A_PATHWAY_SPECIFIC_REPAIR
          path: snn_transform_r6/d6a_source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39687028646

      - name: Download successful D6A.2 artifact
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_GATE_D6A2_TERMINAL_SUPPRESSOR_MAP
          path: snn_transform_r6/d6a2_source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39806081064

      - name: Download successful D6A.3 artifact
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_GATE_D6A3_W2_B2_SUPPRESSOR_INTERACTION
          path: snn_transform_r6/d6a3_source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39819736038

      - name: Download successful D7A artifact
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_GATE_D7A_SAFE_W2_TRAJECTORY_CLAMP
          path: snn_transform_r6/d7a_source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39871827217

      - name: Download frozen D3E execution anchor
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_D3E_R6B4_NATIVE_EXECUTION_ANCHOR
          path: snn_transform_r6/d3e_anchor
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39450940230

      - name: Static audit
        working-directory: snn_transform_r6
        shell: bash
        env:
          PYTHONPATH: ../snn_transform_p3_image:.
        run: |
          set -euo pipefail
          python -m py_compile gate_d_d7a1.py gate_d_d7a1_same_run_w2.py gate_d_d7a.py gate_d_d6a2.py gate_d_d6a.py gate_d_d6a1.py
          python - <<'PY'
          import pathlib
          import p3i_cb_exact_msdl, gate_d_d7a1, gate_d_d7a1_same_run_w2
          p = pathlib.Path('GATE_D7A1_PROTOCOL.md').read_text(encoding='utf-8')
          required = [
              'C1_SINGLE_COMPENSATORY_CARRIER',
              'C2_CONTEXT_DEPENDENT_COMPENSATION',
              'C3_DISTRIBUTED_COMPENSATION',
              'C4_FUNCTIONAL_STATE_CLOSURE_FAILURE',
              'CX_INSUFFICIENT_DUAL_COMPENSATION_LOAD',
              'no trajectory analysis',
          ]
          low = p.lower()
          assert 'gate d7a.1' in low
          assert 'compensation mapping around the safe-w2 constraint' in low
          assert 'no trajectory analysis' in low
          src = pathlib.Path('gate_d_d7a1.py').read_text(encoding='utf-8')
          for token in required[:5]:
              assert token in src
          print('D7A.1 import/static smoke PASS')
          PY
          test -f d6a_source/result/D6A_SUMMARY.json
          test -f d6a_source/result/D6A_F_EM_terminal.pkl
          test -f d6a_source/result/D6A_F_EM_WO_zero_bo_oracle_terminal.pkl
          test -f d6a2_source/result/D6A2_SUMMARY.json
          test -f d6a2_source/result/D6A2_EFFECT_ARRAYS.npz
          test -f d6a3_source/result/D6A3_SUMMARY.json
          test -f d7a_source/result/D7A_SUMMARY.json
          test -f d7a_source/result/D7A_EFFECT_ARRAYS.npz
          test -f d7a_source/result/D7A_F_terminal.pkl
          test -f d7a_source/result/D7A_C_W2_safe_clamp_terminal.pkl
          test -f d3e_anchor/result/HISTORICAL_R6B3_R3_T8_REFERENCE_TRACE.json

      - name: Run Gate D7A.1
        working-directory: snn_transform_r6
        shell: bash
        env:
          PYTHONPATH: ../snn_transform_p3_image:.
        run: |
          set -euo pipefail
          mkdir -p run_gate_d7a1/result
          python gate_d_d7a1_same_run_w2.py \
            --d6a-artifact d6a_source \
            --d6a2-artifact d6a2_source \
            --d6a3-artifact d6a3_source \
            --d7a-artifact d7a_source \
            --anchor-artifact d3e_anchor \
            --out run_gate_d7a1/result \
            --bootstrap 10000 --seed 7311 --threads 4 \
            | tee run_gate_d7a1/console.log

      - name: Show compact D7A.1 result
        if: always()
        working-directory: snn_transform_r6
        run: |
          python - <<'PY'
          import json, pathlib
          f = pathlib.Path('run_gate_d7a1/result/D7A1_SUMMARY.json')
          if not f.exists():
              print('D7A1_SUMMARY.json not produced')
          else:
              d = json.load(open(f))
              loads = d.get('total_compensation_load_C_minus_R', {})
              print(json.dumps({
                  'classification': d.get('classification'),
                  'F61_load': loads.get('F61'),
                  'D_load': loads.get('D_non61'),
                  'C1_blocks': d.get('C1_bidirectional_blocks'),
                  'C2_blocks': d.get('C2_necessity_only_blocks'),
                  'ranked_blocks': d.get('ranked_blocks'),
                  'functional_closure': d.get('functional_closure'),
              }, indent=2))
          PY

      - name: Upload Gate D7A.1 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SNN_TRANSFORM_GATE_D7A1_SAFE_W2_COMPENSATION_MAP
          path: |
            snn_transform_r6/run_gate_d7a1/result/
            snn_transform_r6/run_gate_d7a1/console.log
          if-no-files-found: warn
          retention-days: 30

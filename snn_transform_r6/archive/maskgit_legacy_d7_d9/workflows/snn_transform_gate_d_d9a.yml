name: SNN Transform Gate D9A trajectory functional regulation

on:
  push:
    branches:
      - gate-d-plasticity-spectrum-audit
    paths:
      - 'snn_transform_r6/gate_d_d9a.py'
      - 'snn_transform_r6/gate_d_d9a_vector_theta_launcher.py'
      - 'snn_transform_r6/GATE_D9A_PROTOCOL.md'
      - '.github/workflows/snn_transform_gate_d_d9a.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  d9a-trajectory-functional-regulation:
    runs-on: ubuntu-24.04
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy torch scikit-learn scipy scikit-image matplotlib numba

      - name: Download frozen R6B1 SNN tokenizer
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_R6B1_TUNE_a075_t8
          path: snn_transform_r6/frozen_r6b1
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39139040624

      - name: Download exact R6B3 two-epoch checkpoint
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_R6B3_G2_TWO_EPOCHS
          path: snn_transform_r6/prior_g2
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39170815102

      - name: Download successful D6A artifact
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_GATE_D6A_PATHWAY_SPECIFIC_REPAIR
          path: snn_transform_r6/d6a_source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39687028646

      - name: Download successful D7A artifact
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_GATE_D7A_SAFE_W2_TRAJECTORY_CLAMP
          path: snn_transform_r6/d7a_source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39871827217

      - name: Download successful D8A artifact
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_GATE_D8A_FUNCTIONAL_MODE_IDENTIFICATION
          path: snn_transform_r6/d8a_source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39979543621

      - name: Download successful D8B artifact
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_GATE_D8B_CAUSAL_FUNCTIONAL_MODE
          path: snn_transform_r6/d8b_source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 40021397096

      - name: Download frozen D3E execution anchor
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_D3E_R6B4_NATIVE_EXECUTION_ANCHOR
          path: snn_transform_r6/d3e_anchor
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39450940230

      - name: Download MNIST
        working-directory: snn_transform_r6
        run: |
          mkdir -p run_gate_d9a
          python - <<'PY'
          import urllib.request
          urllib.request.urlretrieve(
              'https://storage.googleapis.com/tensorflow/tf-keras-datasets/mnist.npz',
              'run_gate_d9a/mnist.npz')
          PY

      - name: Static audit
        working-directory: snn_transform_r6
        shell: bash
        env:
          PYTHONPATH: ../snn_transform_p3_image:.
        run: |
          set -euo pipefail
          python -m py_compile gate_d_d9a.py gate_d_d9a_vector_theta_launcher.py gate_d_d8a.py gate_d_d7a.py gate_d_d6a.py r6b4_full_forward_plasticity.py
          python - <<'PY'
          import pathlib
          import p3i_cb_exact_msdl, gate_d_d9a, gate_d_d9a_vector_theta_launcher
          p = pathlib.Path('GATE_D9A_PROTOCOL.md').read_text(encoding='utf-8').lower()
          src = pathlib.Path('gate_d_d9a.py').read_text(encoding='utf-8')
          launch = pathlib.Path('gate_d_d9a_vector_theta_launcher.py').read_text(encoding='utf-8')
          assert 'trajectory-level rank-1 functional regulation' in p
          assert 'evaluation regulator off' in p or 'regulator is active **only while learning' in p
          assert 'q1 — hard functional projection' in p
          assert 'q2 — fixed slow scalar dynamic regulator' in p
          assert 'R3_HARD_AND_DYNAMIC_FUNCTIONAL_RESCUE' in src
          assert 'R2_HARD_FUNCTIONAL_RESCUE_DYNAMIC_APPROX_FAIL' in src
          assert 'R1_HARD_PRIMARY_RESCUE_WITH_GUARDRAIL_TENSION' in src
          assert 'R0_NO_HARD_FUNCTIONAL_TRAJECTORY_RESCUE' in src
          assert 'projected_oracle_self_test' in src
          assert 'evaluation_regulator_off' in src
          assert 'np.asarray(system.theta' in launch
          print('D9A import/static smoke PASS')
          PY
          test -f d6a_source/result/D6A_SUMMARY.json
          test -f d6a_source/result/D6A_EFFECT_ARRAYS.npz
          test -f d6a_source/result/D6A_F_EM_terminal.pkl
          test -f d6a_source/result/D6A_F_EM_WO_zero_bo_oracle_terminal.pkl
          test -f d7a_source/result/D7A_F_terminal.pkl
          test -f d8a_source/result/D8A_SUMMARY.json
          test -f d8a_source/result/D8A_MODES.npz
          test -f d8b_source/result/D8B_SUMMARY.json
          test -f d3e_anchor/result/HISTORICAL_R6B3_R3_T8_REFERENCE_TRACE.json

      - name: Run Gate D9A
        working-directory: snn_transform_r6
        shell: bash
        env:
          PYTHONPATH: ../snn_transform_p3_image:.
        run: |
          set -euo pipefail
          mkdir -p run_gate_d9a/result
          python gate_d_d9a_vector_theta_launcher.py \
            --data run_gate_d9a/mnist.npz \
            --tokenizer frozen_r6b1/result/tokenizer.pt \
            --checkpoint prior_g2/result/checkpoint_2p0000epoch.pkl \
            --d6a-artifact d6a_source \
            --d7a-artifact d7a_source \
            --d8a-artifact d8a_source \
            --d8b-artifact d8b_source \
            --anchor-artifact d3e_anchor \
            --out run_gate_d9a/result \
            --contexts 1024 --eval-images 256 --gen-samples 256 --bootstrap 10000 \
            --encode-batch 256 --seed 7311 --threads 4 \
            | tee run_gate_d9a/console.log

      - name: Show compact D9A result
        if: always()
        working-directory: snn_transform_r6
        run: |
          python - <<'PY'
          import json, pathlib
          f = pathlib.Path('run_gate_d9a/result/D9A_SUMMARY.json')
          if not f.exists():
              print('D9A_SUMMARY.json not produced')
          else:
              d = json.load(open(f))
              P = ('F61','D_non61')
              print(json.dumps({
                  'classification': d.get('classification'),
                  'qref_stats': d.get('qref_stats'),
                  'Q1_primary': {m:d.get('terminal_deployment_contrasts',{}).get('Q1_minus_B',{}).get(m) for m in P},
                  'Q2_primary': {m:d.get('terminal_deployment_contrasts',{}).get('Q2_minus_B',{}).get(m) for m in P},
                  'Q1_gap': {m:d.get('gap_closure',{}).get('Q1',{}).get(m) for m in P},
                  'Q2_gap': {m:d.get('gap_closure',{}).get('Q2',{}).get(m) for m in P},
                  'Q1_regulator': d.get('regulator_work',{}).get('Q1'),
                  'Q2_regulator': d.get('regulator_work',{}).get('Q2'),
                  'Q1_guardrails': d.get('guardrails',{}).get('Q1'),
                  'Q2_guardrails': d.get('guardrails',{}).get('Q2'),
                  'decision': d.get('decision'),
              }, indent=2))
          PY

      - name: Upload Gate D9A artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SNN_TRANSFORM_GATE_D9A_TRAJECTORY_FUNCTIONAL_REGULATION
          path: |
            snn_transform_r6/run_gate_d9a/result/
            snn_transform_r6/run_gate_d9a/console.log
          if-no-files-found: warn
          retention-days: 30

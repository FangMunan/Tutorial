name: SNN Transform Gate D9A.1 plastic functional velocity audit

on:
  push:
    branches:
      - gate-d-plasticity-spectrum-audit
    paths:
      - 'snn_transform_r6/gate_d_d9a1.py'
      - 'snn_transform_r6/gate_d_d9a1_compat.py'
      - 'snn_transform_r6/GATE_D9A1_PROTOCOL.md'
      - '.github/workflows/snn_transform_gate_d_d9a1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  d9a1-plastic-functional-velocity-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy torch scikit-learn scipy scikit-image matplotlib numba

      - name: Download frozen R6B1 SNN tokenizer
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_R6B1_TUNE_a075_t8
          path: snn_transform_r6/frozen_r6b1
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39139040624

      - name: Download exact R6B3 two-epoch checkpoint
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_R6B3_G2_TWO_EPOCHS
          path: snn_transform_r6/prior_g2
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39170815102

      - name: Download successful D7A artifact
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_GATE_D7A_SAFE_W2_TRAJECTORY_CLAMP
          path: snn_transform_r6/d7a_source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39871827217

      - name: Download successful D8A artifact
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_GATE_D8A_FUNCTIONAL_MODE_IDENTIFICATION
          path: snn_transform_r6/d8a_source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39979543621

      - name: Download successful D8B artifact
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_GATE_D8B_CAUSAL_FUNCTIONAL_MODE
          path: snn_transform_r6/d8b_source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 40021397096

      - name: Download successful D9A artifact
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_GATE_D9A_TRAJECTORY_FUNCTIONAL_REGULATION
          path: snn_transform_r6/d9a_source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 40037197274

      - name: Download frozen D3E execution anchor
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_D3E_R6B4_NATIVE_EXECUTION_ANCHOR
          path: snn_transform_r6/d3e_anchor
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39450940230

      - name: Download MNIST
        working-directory: snn_transform_r6
        run: |
          mkdir -p run_gate_d9a1
          python - <<'PY'
          import urllib.request
          urllib.request.urlretrieve(
              'https://storage.googleapis.com/tensorflow/tf-keras-datasets/mnist.npz',
              'run_gate_d9a1/mnist.npz')
          PY

      - name: Static audit
        working-directory: snn_transform_r6
        shell: bash
        env:
          PYTHONPATH: ../snn_transform_p3_image:.
        run: |
          set -euo pipefail
          python -m py_compile gate_d_d9a1.py gate_d_d9a1_compat.py gate_d_d7a.py gate_d_d6a.py r6b4_full_forward_plasticity.py
          python - <<'PY'
          import pathlib
          import gate_d_d9a1
          p = pathlib.Path('GATE_D9A1_PROTOCOL.md').read_text(encoding='utf-8')
          src = pathlib.Path('gate_d_d9a1.py').read_text(encoding='utf-8')
          assert 'exact same-state plastic functional velocity audit' in p.lower()
          assert 'V1_STRONG_PLASTIC_FUNCTIONAL_VELOCITY_SUPPORT' in src
          assert 'V2_RAW_EXCESS_WITH_SIZE_CONFOUND' in src
          assert 'V3_PARTIAL_ARM_SUPPORT' in src
          assert 'V0_NO_HARMFUL_PLASTIC_VELOCITY_EXCESS' in src
          assert 'velocity_intervention_performed' in src
          assert 'C_native' in src
          assert 'stateless_y' in src
          print('D9A.1 import/static smoke PASS')
          PY
          test -f d7a_source/result/D7A_SUMMARY.json
          test -f d7a_source/result/D7A_EFFECT_ARRAYS.npz
          test -f d7a_source/result/D7A_F_terminal.pkl
          test -f d7a_source/result/D7A_B_terminal.pkl
          test -f d7a_source/result/D7A_C_W2_safe_clamp_terminal.pkl
          test -f d8a_source/result/D8A_SUMMARY.json
          test -f d8a_source/result/D8A_MODES.npz
          test -f d8b_source/result/D8B_SUMMARY.json
          test -f d8b_source/result/D8B_EFFECT_ARRAYS.npz
          test -f d9a_source/result/D9A_SUMMARY.json
          test -f d3e_anchor/result/HISTORICAL_R6B3_R3_T8_REFERENCE_TRACE.json

      - name: Run Gate D9A.1
        working-directory: snn_transform_r6
        shell: bash
        env:
          PYTHONPATH: ../snn_transform_p3_image:.
        run: |
          set -euo pipefail
          mkdir -p run_gate_d9a1/result
          python gate_d_d9a1_compat.py \
            --data run_gate_d9a1/mnist.npz \
            --tokenizer frozen_r6b1/result/tokenizer.pt \
            --checkpoint prior_g2/result/checkpoint_2p0000epoch.pkl \
            --d7a-artifact d7a_source \
            --d8a-artifact d8a_source \
            --d8b-artifact d8b_source \
            --d9a-artifact d9a_source \
            --anchor-artifact d3e_anchor \
            --out run_gate_d9a1/result \
            --contexts 1024 --bootstrap 10000 --encode-batch 256 --seed 7311 --threads 4 \
            | tee run_gate_d9a1/console.log

      - name: Show compact D9A.1 result
        if: always()
        working-directory: snn_transform_r6
        run: |
          python - <<'PY'
          import json, pathlib
          f = pathlib.Path('run_gate_d9a1/result/D9A1_SUMMARY.json')
          if not f.exists():
              print('D9A1_SUMMARY.json not produced')
          else:
              d = json.load(open(f))
              print(json.dumps({
                  'classification': d.get('classification'),
                  'aggregates': d.get('aggregates'),
                  'paired_contrasts': d.get('paired_contrasts'),
                  'decision': d.get('decision'),
                  'stateless_forward_parity': d.get('stateless_forward_parity',{}).get('max_abs'),
                  'C_clamp_correction': d.get('trajectory_provenance',{}).get('C_cumulative_W2_clamp_correction'),
                  'checkpoint_drift': d.get('checkpoint_drift'),
              }, indent=2))
          PY

      - name: Upload Gate D9A.1 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SNN_TRANSFORM_GATE_D9A1_PLASTIC_FUNCTIONAL_VELOCITY_AUDIT
          path: |
            snn_transform_r6/run_gate_d9a1/result/
            snn_transform_r6/run_gate_d9a1/console.log
          if-no-files-found: warn
          retention-days: 30

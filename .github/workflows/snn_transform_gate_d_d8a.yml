name: SNN Transform Gate D8A functional-mode identification

on:
  push:
    branches:
      - gate-d-plasticity-spectrum-audit
    paths:
      - 'snn_transform_r6/gate_d_d8a.py'
      - 'snn_transform_r6/GATE_D8A_PROTOCOL.md'
      - '.github/workflows/snn_transform_gate_d_d8a.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  d8a-functional-mode-identification:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy torch scikit-learn scipy scikit-image matplotlib numba

      - name: Download frozen R6B1 SNN tokenizer
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_R6B1_TUNE_a075_t8
          path: snn_transform_r6/frozen_r6b1
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39139040624

      - name: Download successful D6A artifact
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_GATE_D6A_PATHWAY_SPECIFIC_REPAIR
          path: snn_transform_r6/d6a_source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39687028646

      - name: Download successful D7A artifact
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_GATE_D7A_SAFE_W2_TRAJECTORY_CLAMP
          path: snn_transform_r6/d7a_source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39871827217

      - name: Download successful D7A.2 artifact
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_GATE_D7A2_B2_BO_STOPPING_GATE
          path: snn_transform_r6/d7a2_source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39942308903

      - name: Download frozen D3E execution anchor
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_D3E_R6B4_NATIVE_EXECUTION_ANCHOR
          path: snn_transform_r6/d3e_anchor
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39450940230

      - name: Download MNIST
        working-directory: snn_transform_r6
        run: |
          mkdir -p run_gate_d8a
          python - <<'PY'
          import urllib.request
          urllib.request.urlretrieve(
              'https://storage.googleapis.com/tensorflow/tf-keras-datasets/mnist.npz',
              'run_gate_d8a/mnist.npz')
          PY

      - name: Static audit
        working-directory: snn_transform_r6
        shell: bash
        env:
          PYTHONPATH: ../snn_transform_p3_image:.
        run: |
          set -euo pipefail
          python -m py_compile gate_d_d8a.py gate_d_d7a2.py gate_d_d7a1.py gate_d_d6a.py r6b4_full_forward_plasticity.py
          python - <<'PY'
          import pathlib
          import p3i_cb_exact_msdl, gate_d_d8a
          p = pathlib.Path('GATE_D8A_PROTOCOL.md').read_text(encoding='utf-8')
          src = pathlib.Path('gate_d_d8a.py').read_text(encoding='utf-8')
          assert 'gate d8a' in p.lower()
          assert 'disjoint' in p.lower()
          assert 'uncentered' in p.lower()
          assert 'I1_SHARED_LOW_DIMENSIONAL_FUNCTIONAL_CANDIDATE' in src
          assert 'I2_LOW_DIMENSIONAL_BUT_NOT_SHARED' in src
          assert 'I3_HIGH_DIMENSIONAL_FUNCTIONAL_DISPLACEMENT' in src
          assert 'I4_UNSTABLE_SHARED_MODE' in src
          assert 'D8B_frozen_y_pair_basis' in src
          print('D8A import/static smoke PASS')
          PY
          test -f d6a_source/result/D6A_F_EM_WO_zero_bo_oracle_terminal.pkl
          test -f d7a_source/result/D7A_F_terminal.pkl
          test -f d7a_source/result/D7A_C_W2_safe_clamp_terminal.pkl
          test -f d7a2_source/result/D7A2_SUMMARY.json
          test -f d7a2_source/result/D7A2_EFFECT_ARRAYS.npz
          test -f d3e_anchor/result/HISTORICAL_R6B3_R3_T8_REFERENCE_TRACE.json

      - name: Run Gate D8A
        working-directory: snn_transform_r6
        shell: bash
        env:
          PYTHONPATH: ../snn_transform_p3_image:.
        run: |
          set -euo pipefail
          mkdir -p run_gate_d8a/result
          python gate_d_d8a.py \
            --data run_gate_d8a/mnist.npz \
            --tokenizer frozen_r6b1/result/tokenizer.pt \
            --d6a-artifact d6a_source \
            --d7a-artifact d7a_source \
            --d7a2-artifact d7a2_source \
            --anchor-artifact d3e_anchor \
            --out run_gate_d8a/result \
            --discover-images 256 --encode-batch 256 \
            --seed 7311 --threads 4 \
            | tee run_gate_d8a/console.log

      - name: Show compact D8A result
        if: always()
        working-directory: snn_transform_r6
        run: |
          python - <<'PY'
          import json, pathlib
          f = pathlib.Path('run_gate_d8a/result/D8A_SUMMARY.json')
          if not f.exists():
              print('D8A_SUMMARY.json not produced')
          else:
              d = json.load(open(f))
              y = d.get('analysis', {}).get('y', {})
              print(json.dumps({
                  'classification': d.get('classification'),
                  'selected_k': d.get('primary_y_gate', {}).get('selected_k'),
                  'discovery': d.get('discovery'),
                  'y_full_EV': y.get('spectra', {}).get('full', {}).get('EV'),
                  'y_pair_EV': y.get('spectra', {}).get('pair', {}).get('EV'),
                  'y_Gamma': y.get('cross', {}).get('Gamma'),
                  'y_full_pair': y.get('cross', {}).get('principal_full_pair'),
                  'y_pair_release': y.get('cross', {}).get('principal_pair_release'),
                  'stability': d.get('primary_y_gate', {}).get('stability'),
                  'logits_confirmation': d.get('logits_downstream_confirmation'),
                  'decision': d.get('decision'),
              }, indent=2))
          PY

      - name: Upload Gate D8A artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SNN_TRANSFORM_GATE_D8A_FUNCTIONAL_MODE_IDENTIFICATION
          path: |
            snn_transform_r6/run_gate_d8a/result/
            snn_transform_r6/run_gate_d8a/console.log
          if-no-files-found: warn
          retention-days: 30

name: H1-B2.0 Izh Error Localization

on:
  push:
    branches:
      - h1b2-error-localization-20261009
    paths:
      - 'h1_cloud/**'
      - '.github/workflows/h1b2_error_localization.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  h1b2-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy scikit-learn torch torchvision

      - name: Download frozen H1-B artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p h1_cloud/reuse/H1B_IZH
          gh run download 37980789193 \
            --repo FangMunan/Tutorial \
            --name H1B_IZH_RESULTS \
            --dir h1_cloud/reuse/H1B_IZH
          find h1_cloud/reuse/H1B_IZH -maxdepth 2 -type f -printf '%p\n' | sort

      - name: Compile diagnostic source
        run: |
          python -m py_compile \
            h1_cloud/h0_base.py \
            h1_cloud/h1_sparse_fusion.py \
            h1_cloud/h1b_izh_fusion.py \
            h1_cloud/h1b2_error_localization.py

      - name: Run H1-B2.0 localization
        run: |
          mkdir -p h1_cloud/run/H1B2_DIAGNOSTICS
          python h1_cloud/h1b2_error_localization.py \
            --reuse h1_cloud/reuse/H1B_IZH \
            --out h1_cloud/run/H1B2_DIAGNOSTICS \
            --n-per-class 2000 \
            --d 128 \
            --layers 4 \
            --heads 4 \
            --ff 512 \
            --features 128 \
            --seed 7 \
            --threads 4 | tee h1_cloud/run/H1B2_DIAGNOSTICS/run.log

      - name: Show diagnostic summary
        if: always()
        run: |
          if [ -f h1_cloud/run/H1B2_DIAGNOSTICS/H1B2_DIAGNOSTICS.json ]; then
            python - <<'PY'
          import json
          p='h1_cloud/run/H1B2_DIAGNOSTICS/H1B2_DIAGNOSTICS.json'
          d=json.load(open(p))
          print(json.dumps({
            'stage': d.get('stage'),
            'selected_izh_spec': d.get('selected_izh_spec'),
            'diagnostic_ratios': d.get('diagnostic_ratios'),
            'one_layer_replacement': d.get('one_layer_replacement'),
            'side_replacement': d.get('side_replacement'),
            'layer_side_scalar_summary': d.get('layer_side_scalar_summary'),
          }, indent=2))
          PY
          fi

      - name: Upload H1-B2.0 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: H1B2_ERROR_LOCALIZATION
          path: h1_cloud/run/H1B2_DIAGNOSTICS
          if-no-files-found: warn
          retention-days: 14

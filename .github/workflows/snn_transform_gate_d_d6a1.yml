name: SNN Transform Gate D6A.1 state-dependent repair interaction

on:
  push:
    branches:
      - gate-d-plasticity-spectrum-audit
    paths:
      - 'snn_transform_r6/gate_d_d6a1.py'
      - 'snn_transform_r6/GATE_D6A1_PROTOCOL.md'
      - '.github/workflows/snn_transform_gate_d_d6a1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  d6a1-interaction-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy torch scikit-learn scipy scikit-image matplotlib numba
      - name: Download frozen R6B1 SNN tokenizer
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_R6B1_TUNE_a075_t8
          path: snn_transform_r6/frozen_r6b1
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39139040624
      - name: Download exact R6B3 two-epoch checkpoint
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_R6B3_G2_TWO_EPOCHS
          path: snn_transform_r6/prior_g2
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39170815102
      - name: Download successful D6A artifact
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_GATE_D6A_PATHWAY_SPECIFIC_REPAIR
          path: snn_transform_r6/d6a_source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39687028646
      - name: Download frozen D3E execution anchor
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_D3E_R6B4_NATIVE_EXECUTION_ANCHOR
          path: snn_transform_r6/d3e_anchor
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39450940230
      - name: Download MNIST
        working-directory: snn_transform_r6
        run: |
          mkdir -p run_gate_d6a1
          python - <<'PY'
          import urllib.request
          urllib.request.urlretrieve(
              'https://storage.googleapis.com/tensorflow/tf-keras-datasets/mnist.npz',
              'run_gate_d6a1/mnist.npz')
          PY
      - name: Static audit
        working-directory: snn_transform_r6
        shell: bash
        env:
          PYTHONPATH: ../snn_transform_p3_image:.
        run: |
          set -euo pipefail
          python -m py_compile gate_d_d6a1.py gate_d_d6a.py gate_d_d5c.py gate_d_d5a.py gate_d_d3e_runtime.py r6b4_full_forward_plasticity.py
          python - <<'PY'
          import p3i_cb_exact_msdl, gate_d_d6a1
          print('D6A.1 import smoke PASS')
          PY
          grep -q "I1_DIRECT_PATHWAY_COUPLING" gate_d_d6a1.py
          grep -q "I2_MEDIATED_NETWORK_COUPLING" gate_d_d6a1.py
          grep -q "I3_NO_INTRINSIC_BO_REPAIR_DEGRADATION" gate_d_d6a1.py
          grep -q "Common-background bo utility" GATE_D6A1_PROTOCOL.md
          grep -q "Hybrid WO-swap" GATE_D6A1_PROTOCOL.md
          grep -q "replay/checkpoint/transplant/readout audit only" GATE_D6A1_PROTOCOL.md
          test -f d6a_source/result/D6A_SUMMARY.json
          test -f d6a_source/result/D6A_EFFECT_ARRAYS.npz
          test -f d6a_source/result/D6A_F_EM_bo_oracle_terminal.pkl
          test -f d6a_source/result/D6A_F_EM_WO_zero_bo_oracle_terminal.pkl
          test -f d6a_source/result/D6A_F_EM_terminal.pkl
          test -f d3e_anchor/result/R6B4_NATIVE_GATE_A_EXECUTION_ANCHOR.npz
          test -f d3e_anchor/result/HISTORICAL_R6B3_R3_T8_REFERENCE_TRACE.json
      - name: Run Gate D6A.1
        working-directory: snn_transform_r6
        shell: bash
        env:
          PYTHONPATH: ../snn_transform_p3_image:.
        run: |
          set -euo pipefail
          mkdir -p run_gate_d6a1/result
          python gate_d_d6a1.py \
            --data run_gate_d6a1/mnist.npz \
            --tokenizer frozen_r6b1/result/tokenizer.pt \
            --checkpoint prior_g2/result/checkpoint_2p0000epoch.pkl \
            --d6a-artifact d6a_source \
            --anchor-artifact d3e_anchor \
            --out run_gate_d6a1/result \
            --contexts 1024 --eval-images 256 --bootstrap 10000 \
            --encode-batch 256 --seed 7311 --threads 4 \
            | tee run_gate_d6a1/console.log
      - name: Show compact D6A.1 result
        if: always()
        working-directory: snn_transform_r6
        run: |
          python - <<'PY'
          import json, pathlib
          f=pathlib.Path('run_gate_d6a1/result/D6A1_SUMMARY.json')
          if not f.exists():
              print('D6A1_SUMMARY.json not produced')
          else:
              d=json.load(open(f))
              print(json.dumps({
                  'classification':d.get('classification'),
                  'decision':d.get('decision'),
                  'terminal_utility':d.get('common_background_bo_utility',{}).get('1024'),
                  'terminal_gradient':d.get('fixed_probe_gradient_field',{}).get('1024'),
                  'terminal_replay':d.get('terminal_GateA_replay_calibration'),
              },indent=2))
          PY
      - name: Upload Gate D6A.1 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SNN_TRANSFORM_GATE_D6A1_STATE_DEPENDENT_REPAIR_INTERACTION
          path: |
            snn_transform_r6/run_gate_d6a1/result/
            snn_transform_r6/run_gate_d6a1/console.log
          if-no-files-found: warn
          retention-days: 30

name: Unified SNN-Transform Lightweight

on:
  workflow_dispatch:
  push:
    branches:
      - snn-transform-unified-20261014
    paths:
      - 'unified_snn_transform/**'
      - '.github/workflows/snn_transform_unified.yml'

jobs:
  unified-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Compile
        run: |
          python -m py_compile unified_snn_transform/run_unified_gate.py
          python -m py_compile unified_snn_transform/run_u2_event_qkv.py
          python -m py_compile unified_snn_transform/run_u3_trained_retrieval.py
          python -m py_compile unified_snn_transform/run_u3.py
          python -m py_compile unified_snn_transform/run_u31_izh_localization.py
          python -m py_compile unified_snn_transform/run_u3b_selective_state.py

      - name: Run U0-U1 unified lightweight gate
        run: |
          mkdir -p unified_snn_transform/run/U0_U1
          python unified_snn_transform/run_unified_gate.py \
            --out unified_snn_transform/run/U0_U1 \
            --tokens 16 --d 32 --heads 2 --features 32 --ff 64 \
            --steps 6 --batch 4 --change-frac 0.25 \
            --seed 7 --threads 4 | tee unified_snn_transform/run/U0_U1/run.log

      - name: Run U2 event-cached QKV gate
        run: |
          mkdir -p unified_snn_transform/run/U2
          python unified_snn_transform/run_u2_event_qkv.py \
            --out unified_snn_transform/run/U2 \
            --tokens 16 --d 32 --heads 2 --features 32 --ff 64 \
            --steps 6 --batch 4 --change-frac 0.25 --eps 1e-5 \
            --seed 7 --threads 4 | tee unified_snn_transform/run/U2/run.log

      - name: Run U3 trained associative-retrieval gate
        run: |
          mkdir -p unified_snn_transform/run/U3
          python unified_snn_transform/run_u3.py \
            --out unified_snn_transform/run/U3 \
            --tokens 16 --d 32 --heads 2 --features 32 --ff 64 --value-dim 8 \
            --train-steps 800 --train-batch 128 --lr 0.002 --report-every 100 \
            --eval-batches 8 --eval-batch 128 --trajectory-steps 6 --audit-batch 64 \
            --task-gate 0.85 --seed 7 --threads 4 | tee unified_snn_transform/run/U3/run.log

      - name: Run U3.1 trained-distribution Izh localization
        run: |
          mkdir -p unified_snn_transform/run/U31
          python unified_snn_transform/run_u31_izh_localization.py \
            --checkpoint unified_snn_transform/run/U3/U3_REFERENCE.pt \
            --out unified_snn_transform/run/U31 \
            --topn 6 --select-batches 3 --test-batches 8 --batch 64 \
            --window-penalty 0.00001 --seed 17 --threads 4 \
            | tee unified_snn_transform/run/U31/run.log

      - name: Run U3B selective-state functional gate
        run: |
          mkdir -p unified_snn_transform/run/U3B
          python unified_snn_transform/run_u3b_selective_state.py \
            --out unified_snn_transform/run/U3B \
            --tokens 16 --d 32 --heads 2 --features 32 --ff 64 \
            --value-dim 8 --nkeys 4 --reset-amp 8 \
            --train-steps 1200 --train-batch 128 --lr 0.002 --report-every 200 \
            --eval-batches 8 --eval-batch 128 --seed 23 --threads 4 \
            | tee unified_snn_transform/run/U3B/run.log

      - name: Show summaries
        if: always()
        run: |
          python - <<'PY'
          import json, os
          files=[
              ('U0_U1','unified_snn_transform/run/U0_U1/UNIFIED_RESULTS.json'),
              ('U2','unified_snn_transform/run/U2/U2_RESULTS.json'),
              ('U3','unified_snn_transform/run/U3/U3_RESULTS.json'),
              ('U31','unified_snn_transform/run/U31/U31_RESULTS.json'),
              ('U3B','unified_snn_transform/run/U3B/U3B_RESULTS.json')]
          for name,path in files:
              if not os.path.exists(path): continue
              d=json.load(open(path));print('\n===',name,'===')
              if name=='U3B':
                  keep={'stage':d.get('stage'),'PASS':d.get('PASS'),'gates':d.get('gates'),
                        'selective_eval':d.get('selective_eval'),'selective_identity_ablation':d.get('selective_identity_ablation'),
                        'matched_fixed_eval':d.get('matched_fixed_eval'),'post_reset_selective_advantage':d.get('post_reset_selective_advantage'),
                        'alpha_selectivity_gap':d.get('alpha_selectivity_gap'),'decision':d.get('decision')}
              elif name=='U31':
                  keep={'stage':d.get('stage'),'gates':d.get('gates'),'PASS':d.get('PASS'),
                        'selected_Q':d.get('expanded_search',{}).get('selected_Q'),
                        'selected_K':d.get('expanded_search',{}).get('selected_K'),
                        'heldout_QK':d.get('heldout_QK'),'decision':d.get('decision')}
              elif name=='U3':
                  keep={'stage':d.get('stage'),'gates':d.get('gates'),'PASS':d.get('PASS'),
                        'reference_task':d.get('reference_task'),'shuffled_binding_control':d.get('shuffled_binding_control'),
                        'binding_sign_accuracy_drop':d.get('binding_sign_accuracy_drop'),
                        'izh_parity':d.get('izh_parity'),'density_summary':d.get('trajectory_audit',{}).get('density_summary'),
                        'decision':d.get('decision')}
              elif name=='U2':
                  keep={'stage':d.get('stage'),'gates':d.get('gates'),'PASS':d.get('PASS'),
                        'q':d.get('q'),'k':d.get('k'),'v':d.get('v'),'decision':d.get('decision')}
              else:
                  keep={'stage':d.get('stage'),'gates':d.get('gates'),'PASS':d.get('PASS'),
                        'summary':d.get('summary'),'compute':d.get('compute'),'calibration':d.get('calibration')}
              print(json.dumps(keep,indent=2))
          PY

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SNN_TRANSFORM_UNIFIED_U0_U3B
          path: unified_snn_transform/run
          retention-days: 30

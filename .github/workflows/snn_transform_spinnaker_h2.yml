name: SNN Transform SpiNNaker H2 APLX Kernels

on:
  push:
    branches:
      - snn-transform-spinnaker-h0-h1-20261014
    paths:
      - 'spinnaker_backend/h2_aplx/**'
      - '.github/workflows/snn_transform_spinnaker_h2.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  h2_host_kernel_gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install host test dependency
        run: python -m pip install numpy
      - name: Download frozen H1.1 functional-v9 HIR
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_SPINNAKER_H1_1_FUNCTIONAL_V9
          path: spinnaker_backend/run/H2/source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 38575839809
      - name: Show frozen HIR payload
        run: find spinnaker_backend/run/H2/source -maxdepth 4 -type f -print
      - name: Show C compiler
        run: gcc --version
      - name: Strict host compile
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror \
            -c spinnaker_backend/h2_aplx/h2_kernels.c \
            -o /tmp/h2_kernels.o
      - name: Run bit-exact H2 primitive kernel parity gate
        run: python spinnaker_backend/h2_aplx/test_h2_kernels.py
      - name: Run H2D actual frozen-HIR full-step parity gate
        run: |
          PYTHONPATH=. python spinnaker_backend/h2_aplx/test_h2_actual_hir.py \
            --hir spinnaker_backend/run/H2/source/functional_v9/SNNTransformBlock_v1_1_HIR_H1_1_FUNCTIONAL_V9.npz
      - name: Record H2 scope
        run: |
          echo 'H2 host C full-step parity gate only.'
          echo 'This does not claim APLX cross-compilation or SpiNNaker board execution.'

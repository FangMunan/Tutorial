name: SNN Transform E27 MSDL Cloud Gate

on:
  workflow_dispatch:
    inputs:
      wall_minutes:
        description: 'Candidate training wall-clock budget in minutes'
        required: false
        default: '55'
      epochs:
        description: 'Maximum epochs; wall budget can stop earlier'
        required: false
        default: '30'
      lr_scale:
        description: 'Global multiplier for local MSDL rates'
        required: false
        default: '1.0'
      qk_start_epoch:
        description: 'Epoch at which Q/K perturbative MSDL is enabled'
        required: false
        default: '2'
  push:
    branches: [camp4]
    paths:
      - 'snn_transform_e27/RUN_TRIGGER'

permissions:
  contents: read
  actions: read

jobs:
  e27_msdl:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          ref: camp4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy torch scikit-learn matplotlib
      - name: Static checks
        working-directory: snn_transform_e27
        run: |
          python -m py_compile model.py msdl.py train.py
          python - <<'PY'
          import torch
          from model import Model,L,K,MASK
          m=Model(27101).eval()
          x=torch.randint(0,K,(2,L)); x[:,::3]=MASK
          with torch.no_grad(): y,tr=m(x,True)
          assert y.shape==(2,49,64)
          assert len(tr)==4
          assert torch.isfinite(y).all()
          print({'params':sum(p.numel() for p in m.parameters()),'shape':list(y.shape),'blocks':len(tr)})
          PY
      - name: Resolve run controls
        id: ctl
        shell: bash
        run: |
          WALL='${{ github.event.inputs.wall_minutes }}'; WALL=${WALL:-55}
          EPOCHS='${{ github.event.inputs.epochs }}'; EPOCHS=${EPOCHS:-30}
          LRS='${{ github.event.inputs.lr_scale }}'; LRS=${LRS:-1.0}
          QK='${{ github.event.inputs.qk_start_epoch }}'; QK=${QK:-2}
          echo "wall=$WALL" >> "$GITHUB_OUTPUT"
          echo "epochs=$EPOCHS" >> "$GITHUB_OUTPUT"
          echo "lrscale=$LRS" >> "$GITHUB_OUTPUT"
          echo "qk=$QK" >> "$GITHUB_OUTPUT"
      - name: Run MSDL cloud gate
        working-directory: snn_transform_e27
        run: |
          mkdir -p run_e27
          python train.py \
            --data ../data/mnist_e27.npz \
            --out run_e27 \
            --epochs '${{ steps.ctl.outputs.epochs }}' \
            --batch 32 \
            --threads 2 \
            --seed 27101 \
            --lr-scale '${{ steps.ctl.outputs.lrscale }}' \
            --qk-start-epoch '${{ steps.ctl.outputs.qk }}' \
            --qk-groups 4 \
            --eval-every 2 \
            --wall-minutes '${{ steps.ctl.outputs.wall }}' \
            --generate 100 | tee run_e27/console.log
      - name: Inspect final metrics
        if: always()
        working-directory: snn_transform_e27
        run: |
          if [ -f run_e27/metrics.json ]; then cat run_e27/metrics.json; fi
      - name: Upload E27 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SNN_TRANSFORM_E27_MSDL_CLOUD
          path: |
            snn_transform_e27/run_e27/metrics.json
            snn_transform_e27/run_e27/generation.png
            snn_transform_e27/run_e27/generation.npz
            snn_transform_e27/run_e27/latest.pt
            snn_transform_e27/run_e27/codebook.npy
            snn_transform_e27/run_e27/console.log
          if-no-files-found: warn
          retention-days: 30

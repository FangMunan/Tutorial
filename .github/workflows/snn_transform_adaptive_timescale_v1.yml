name: SNN Transform Adaptive Timescale v1

on:
  workflow_dispatch:
    inputs:
      fractional_epoch:
        description: Fraction of one shuffled training epoch for the first functional run
        required: true
        default: '1.0'
      gen_samples:
        description: Final autonomous samples
        required: true
        default: '100'
      eval_images:
        description: Test images per fixed mask-ratio evaluation
        required: true
        default: '256'

permissions:
  contents: read
  actions: read

jobs:
  adaptive-timescale-v1:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout Adaptive Timescale experiment branch
        uses: actions/checkout@v4
        with:
          ref: gate-d-plasticity-spectrum-audit

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy torch scikit-learn scipy scikit-image matplotlib numba

      - name: Download frozen R6B1 SNN tokenizer
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_R6B1_TUNE_a075_t8
          path: snn_transform_r6/frozen_r6b1
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39139040624

      - name: Download MNIST
        working-directory: snn_transform_r6
        run: |
          mkdir -p run_adaptive_timescale_v1
          python - <<'PY'
          import urllib.request
          urllib.request.urlretrieve(
              'https://storage.googleapis.com/tensorflow/tf-keras-datasets/mnist.npz',
              'run_adaptive_timescale_v1/mnist.npz')
          PY

      - name: Static audit and self-tests
        working-directory: snn_transform_r6
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            adaptive_timescale_v1.py \
            r6b4_full_forward_plasticity.py \
            maskgit_msdl_training.py \
            maskgit_msdl_training_unconditional.py \
            maskgit_input_representation.py \
            maskgit_scheduled_parallel.py \
            r6b2_snn_encoder_p3_msdl.py \
            r6b3_context_epoch_training.py \
            r6b3_snn_encoder_maskgit_msdl.py \
            ../snn_transform_p3_image/p3i_cb_exact_msdl.py
          grep -q "loss_t updates tau_(t+1)" adaptive_timescale_v1.py
          grep -q "backpropagation_or_bptt_used.*False" adaptive_timescale_v1.py
          grep -q "GROUP_PARAMETERS" adaptive_timescale_v1.py
          python adaptive_timescale_v1.py --self-test-only

      - name: Run first functional adaptive-timescale training
        working-directory: snn_transform_r6
        shell: bash
        run: |
          set -euo pipefail
          OUT=run_adaptive_timescale_v1/result
          mkdir -p "$OUT"
          python adaptive_timescale_v1.py \
            --data run_adaptive_timescale_v1/mnist.npz \
            --tokenizer frozen_r6b1/result/tokenizer.pt \
            --out "$OUT" \
            --fractional-epoch "${{ inputs.fractional_epoch || '1.0' }}" \
            --D 96 --heads 8 --features 24 --ff 192 --R 7 \
            --scaffold-contexts 2000 --scaffold-paths 2500 --scaffold-lr 0.6 \
            --internal-lr-scale 0.5 --aux-lr-scale 1.0 \
            --tau-fast 1 --tau-medium 5 --tau-slow 25 \
            --tau-min 0.25 --tau-max 100 \
            --ema-beta 0.05 --feedback-interval 32 --trend-window 128 \
            --trend-deadband 0.005 --feedback-log-step 0.08 \
            --warmup-contexts 128 --plateau-patience 3 \
            --retire-factor 4 --release-ratio 1.25 \
            --eval-images "${{ inputs.eval_images || '256' }}" \
            --gen-samples "${{ inputs.gen_samples || '100' }}" \
            --grid-samples 100 --decode-iterations 8 --choice-temperature 4.5 \
            --encode-batch 256 --report-every-contexts 128 \
            --seed 7311 --threads 4 \
            | tee run_adaptive_timescale_v1/console.log

      - name: Show concise result
        if: always()
        working-directory: snn_transform_r6
        run: |
          test -f run_adaptive_timescale_v1/result/ADAPTIVE_TIMESCALE_V1_RESULTS.json && python - <<'PY'
          import json
          p='run_adaptive_timescale_v1/result/ADAPTIVE_TIMESCALE_V1_RESULTS.json'
          d=json.load(open(p))
          print(json.dumps({
            'contexts_trained':d['contexts_trained'],
            'initial_tau':d['initial_tau'],
            'final_tau':d['final_tau'],
            'final_focus':d['final_focus'],
            'handover_count':d['handover_count'],
            'masked_eval':d['masked_eval'],
            'generation':d['generation'],
            'group_movement_total':d['group_movement_total'],
            'all_system_arrays_finite':d['all_system_arrays_finite'],
            'self_tests':d['self_tests'],
          },indent=2))
          PY

      - name: Upload Adaptive Timescale v1 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SNN_TRANSFORM_ADAPTIVE_TIMESCALE_V1
          path: |
            snn_transform_r6/run_adaptive_timescale_v1/result/
            snn_transform_r6/run_adaptive_timescale_v1/console.log
          if-no-files-found: warn
          retention-days: 30

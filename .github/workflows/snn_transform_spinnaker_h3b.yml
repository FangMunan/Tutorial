name: SNN Transform SpiNNaker H3B Single-Chip Scaling

on:
  push:
    branches:
      - snn-transform-spinnaker-h0-h1-20261014
    paths:
      - 'spinnaker_backend/h3b_single_chip/**'
      - 'spinnaker_backend/h3a_single_core/prepare_h3a_package.py'
      - 'spinnaker_backend/h2_aplx/h2_kernels.*'
      - 'spinnaker_backend/h2_aplx/test_h2_actual_hir.py'
      - 'spinnaker_backend/h2f_aplx/h2f_contract.*'
      - 'spinnaker_backend/h2f_aplx/run_h2f_spalloc_board.py'
      - '.github/workflows/snn_transform_spinnaker_h3b.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  h3b_build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install host dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy 'SpiNNUtilities==1!7.4.1'

      - name: Download frozen H1.1 functional-v9 HIR
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_SPINNAKER_H1_1_FUNCTIONAL_V9
          path: spinnaker_backend/run/H3B/source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 38575839809

      - name: Static-check H3B Python
        run: |
          python -m py_compile spinnaker_backend/h3b_single_chip/h3b_contract.py
          python -m py_compile spinnaker_backend/h3b_single_chip/prepare_h3b_package.py
          python -m py_compile spinnaker_backend/h3b_single_chip/run_h3b_single_chip.py
          python -m py_compile spinnaker_backend/h3b_single_chip/run_h3b1_sweep.py

      - name: Generate H3B0 P2 N64 regression package
        run: |
          mkdir -p spinnaker_backend/run/H3B/packages
          HIR=spinnaker_backend/run/H3B/source/functional_v9/SNNTransformBlock_v1_1_HIR_H1_1_FUNCTIONAL_V9.npz
          PYTHONPATH=. python spinnaker_backend/h3b_single_chip/prepare_h3b_package.py \
            --hir "$HIR" \
            --out spinnaker_backend/run/H3B/packages/H3B_P2_N64.npz \
            --workers 2 --local-tokens 32 --steps 6 --change-frac 0.25 \
            --seed 37171 --pacing-us 1 \
            --stage H3B0_DISTRIBUTED_CORRECTNESS

      - name: Generate H3B1 balanced weak-scaling packages
        run: |
          HIR=spinnaker_backend/run/H3B/source/functional_v9/SNNTransformBlock_v1_1_HIR_H1_1_FUNCTIONAL_V9.npz
          for P in 2 4 8 16; do
            N=$((32 * P))
            PYTHONPATH=. python spinnaker_backend/h3b_single_chip/prepare_h3b_package.py \
              --hir "$HIR" \
              --out "spinnaker_backend/run/H3B/packages/H3B1_P${P}_N${N}.npz" \
              --workers "$P" --local-tokens 32 --steps 6 --change-frac 0.25 \
              --seed 47171 --pacing-us 1 --balanced-local-changes \
              --stage H3B1_WEAK_SCALING
          done

      - name: Inspect H3B host gates
        run: |
          PYTHONPATH=. python - <<'PY'
          import json, numpy as np
          from pathlib import Path

          p0=Path('spinnaker_backend/run/H3B/packages/H3B_P2_N64.npz')
          z=np.load(p0,allow_pickle=False)
          m=json.loads(bytes(z['package_metadata_json_utf8'].tolist()).decode())
          assert m['workers']==2 and m['global_tokens']==64
          assert m['host_distributed_gate']['PASS'] is True
          assert m['host_distributed_gate']['final_arrays_bit_exact'] is True

          rows=[]
          for P in (2,4,8,16):
              N=32*P
              p=Path(f'spinnaker_backend/run/H3B/packages/H3B1_P{P}_N{N}.npz')
              z=np.load(p,allow_pickle=False)
              m=json.loads(bytes(z['package_metadata_json_utf8'].tolist()).decode())
              assert m['stage']=='H3B1_WEAK_SCALING'
              assert m['workers']==P and m['local_tokens']==32 and m['global_tokens']==N
              assert m['balanced_local_changes'] is True
              assert m['local_changes_per_update']==8
              assert m['expected_qkv_evals_per_worker']==[72]*P
              assert m['host_distributed_gate']['PASS'] is True
              assert m['host_distributed_gate']['final_arrays_bit_exact'] is True
              rows.append({
                  'workers':P, 'global_tokens':N,
                  'arena_bytes_per_worker':m['worker_arena_bytes_requested'],
                  'qkv_evals_per_worker':72,
                  'host_bit_exact':True,
              })
          print(json.dumps({'stage':'H3B1_PREBOARD','PASS':True,'points':rows},indent=2))
          PY

      - name: Install GNU Arm embedded toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi make perl git
          arm-none-eabi-gcc --version

      - name: Checkout and build pinned low-level SpiNNaker tools
        run: |
          git clone https://github.com/SpiNNakerManchester/spinnaker_tools.git /tmp/spinnaker_tools
          git -C /tmp/spinnaker_tools checkout 619bd2b0726e970a8500079b5542e745200e62be
          make -C /tmp/spinnaker_tools GNU=1

      - name: Cross-compile H3B worker APLX
        env:
          SPINN_DIRS: /tmp/spinnaker_tools
          SPINN_INSTALL_DIR: /tmp/spinnaker_tools
        run: |
          make -C spinnaker_backend/h3b_single_chip GNU=1 DEBUG=1
          test -s spinnaker_backend/h3b_single_chip/snn_transform_h3b_worker.aplx
          test -s spinnaker_backend/h3b_single_chip/build/gnu/snn_transform_h3b_worker.elf
          arm-none-eabi-nm spinnaker_backend/h3b_single_chip/build/gnu/snn_transform_h3b_worker.elf | grep ' c_main$'
          ls -lh spinnaker_backend/h3b_single_chip/snn_transform_h3b_worker.aplx

      - name: Stage runnable H3B0 board bundle
        run: |
          rm -rf H3B0_BOARD_READY
          mkdir -p H3B0_BOARD_READY/spinnaker_backend/h3b_single_chip
          mkdir -p H3B0_BOARD_READY/spinnaker_backend/h2f_aplx
          mkdir -p H3B0_BOARD_READY/run/H3B/packages
          touch H3B0_BOARD_READY/spinnaker_backend/__init__.py
          touch H3B0_BOARD_READY/spinnaker_backend/h3b_single_chip/__init__.py
          touch H3B0_BOARD_READY/spinnaker_backend/h2f_aplx/__init__.py
          cp spinnaker_backend/h3b_single_chip/snn_transform_h3b_worker.aplx H3B0_BOARD_READY/spinnaker_backend/h3b_single_chip/
          cp spinnaker_backend/h3b_single_chip/run_h3b_single_chip.py H3B0_BOARD_READY/spinnaker_backend/h3b_single_chip/
          cp spinnaker_backend/h3b_single_chip/h3b_contract.py H3B0_BOARD_READY/spinnaker_backend/h3b_single_chip/
          cp spinnaker_backend/h3b_single_chip/H3B_STATUS.md H3B0_BOARD_READY/spinnaker_backend/h3b_single_chip/
          cp spinnaker_backend/h2f_aplx/run_h2f_spalloc_board.py H3B0_BOARD_READY/spinnaker_backend/h2f_aplx/
          cp spinnaker_backend/h2f_aplx/h2f_contract.py H3B0_BOARD_READY/spinnaker_backend/h2f_aplx/
          cp spinnaker_backend/run/H3B/packages/H3B_P2_N64.npz H3B0_BOARD_READY/run/H3B/packages/
          cat > H3B0_BOARD_READY/README_RUN.txt <<'TXT'
          Run from this directory:
          python spinnaker_backend/h3b_single_chip/run_h3b_single_chip.py \
            --aplx spinnaker_backend/h3b_single_chip/snn_transform_h3b_worker.aplx \
            --package run/H3B/packages/H3B_P2_N64.npz \
            --source-config /home/jovyan/.spynnaker.cfg
          TXT
          PYTHONPATH=H3B0_BOARD_READY python - <<'PY'
          import spinnaker_backend.h2f_aplx.run_h2f_spalloc_board
          import spinnaker_backend.h3b_single_chip.h3b_contract
          print('H3B0 staged bundle imports: PASS')
          PY

      - name: Stage runnable H3B1 sweep bundle
        run: |
          rm -rf H3B1_BOARD_READY
          mkdir -p H3B1_BOARD_READY/spinnaker_backend/h3b_single_chip
          mkdir -p H3B1_BOARD_READY/spinnaker_backend/h2f_aplx
          mkdir -p H3B1_BOARD_READY/run/H3B/packages
          touch H3B1_BOARD_READY/spinnaker_backend/__init__.py
          touch H3B1_BOARD_READY/spinnaker_backend/h3b_single_chip/__init__.py
          touch H3B1_BOARD_READY/spinnaker_backend/h2f_aplx/__init__.py
          cp spinnaker_backend/h3b_single_chip/snn_transform_h3b_worker.aplx H3B1_BOARD_READY/spinnaker_backend/h3b_single_chip/
          cp spinnaker_backend/h3b_single_chip/run_h3b_single_chip.py H3B1_BOARD_READY/spinnaker_backend/h3b_single_chip/
          cp spinnaker_backend/h3b_single_chip/run_h3b1_sweep.py H3B1_BOARD_READY/spinnaker_backend/h3b_single_chip/
          cp spinnaker_backend/h3b_single_chip/h3b_contract.py H3B1_BOARD_READY/spinnaker_backend/h3b_single_chip/
          cp spinnaker_backend/h3b_single_chip/H3B_STATUS.md H3B1_BOARD_READY/spinnaker_backend/h3b_single_chip/
          cp spinnaker_backend/h2f_aplx/run_h2f_spalloc_board.py H3B1_BOARD_READY/spinnaker_backend/h2f_aplx/
          cp spinnaker_backend/h2f_aplx/h2f_contract.py H3B1_BOARD_READY/spinnaker_backend/h2f_aplx/
          cp spinnaker_backend/run/H3B/packages/H3B1_P*_N*.npz H3B1_BOARD_READY/run/H3B/packages/
          cat > H3B1_BOARD_READY/README_RUN.txt <<'TXT'
          Run from this directory:
          python spinnaker_backend/h3b_single_chip/run_h3b1_sweep.py \
            --aplx spinnaker_backend/h3b_single_chip/snn_transform_h3b_worker.aplx \
            --package-dir run/H3B/packages \
            --source-config /home/jovyan/.spynnaker.cfg \
            --workers 2,4,8,16
          TXT
          PYTHONPATH=H3B1_BOARD_READY python - <<'PY'
          import spinnaker_backend.h2f_aplx.run_h2f_spalloc_board
          import spinnaker_backend.h3b_single_chip.h3b_contract
          import spinnaker_backend.h3b_single_chip.run_h3b1_sweep
          print('H3B1 staged bundle imports: PASS')
          PY

      - name: Upload H3B0 board bundle
        uses: actions/upload-artifact@v4
        with:
          name: SNN_TRANSFORM_H3B0_SINGLE_CHIP_BUNDLE
          path: H3B0_BOARD_READY
          retention-days: 30

      - name: Upload H3B1 weak-scaling bundle
        uses: actions/upload-artifact@v4
        with:
          name: SNN_TRANSFORM_H3B1_SINGLE_CHIP_SWEEP_BUNDLE
          path: H3B1_BOARD_READY
          retention-days: 30

name: SNN Transform Gate D7A safe-W2 trajectory clamp

on:
  push:
    branches:
      - gate-d-plasticity-spectrum-audit
    paths:
      - 'snn_transform_r6/gate_d_d7a.py'
      - 'snn_transform_r6/GATE_D7A_PROTOCOL.md'
      - '.github/workflows/snn_transform_gate_d_d7a.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  d7a-safe-w2-trajectory-clamp:
    runs-on: ubuntu-24.04
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy torch scikit-learn scipy scikit-image matplotlib numba
      - name: Download frozen R6B1 SNN tokenizer
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_R6B1_TUNE_a075_t8
          path: snn_transform_r6/frozen_r6b1
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39139040624
      - name: Download exact R6B3 two-epoch checkpoint
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_R6B3_G2_TWO_EPOCHS
          path: snn_transform_r6/prior_g2
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39170815102
      - name: Download successful D6A artifact
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_GATE_D6A_PATHWAY_SPECIFIC_REPAIR
          path: snn_transform_r6/d6a_source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39687028646
      - name: Download successful D6A.1 artifact
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_GATE_D6A1_STATE_DEPENDENT_REPAIR_INTERACTION
          path: snn_transform_r6/d6a1_source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39777693838
      - name: Download successful D6A.2 artifact
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_GATE_D6A2_TERMINAL_SUPPRESSOR_MAP
          path: snn_transform_r6/d6a2_source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39806081064
      - name: Download successful D6A.3 artifact
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_GATE_D6A3_W2_B2_SUPPRESSOR_INTERACTION
          path: snn_transform_r6/d6a3_source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39819736038
      - name: Download frozen D3E execution anchor
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_D3E_R6B4_NATIVE_EXECUTION_ANCHOR
          path: snn_transform_r6/d3e_anchor
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39450940230
      - name: Download MNIST
        working-directory: snn_transform_r6
        run: |
          mkdir -p run_gate_d7a
          python - <<'PY'
          import urllib.request
          urllib.request.urlretrieve(
              'https://storage.googleapis.com/tensorflow/tf-keras-datasets/mnist.npz',
              'run_gate_d7a/mnist.npz')
          PY
      - name: Static audit
        working-directory: snn_transform_r6
        shell: bash
        env:
          PYTHONPATH: ../snn_transform_p3_image:.
        run: |
          set -euo pipefail
          python -m py_compile gate_d_d7a.py gate_d_d6a.py gate_d_d6a1.py gate_d_d3e_runtime.py r6b4_full_forward_plasticity.py
          python - <<'PY'
          import p3i_cb_exact_msdl, gate_d_d7a
          print('D7A import smoke PASS')
          PY
          grep -q "T1_STRONG_W2_TRAJECTORY_RESCUE" gate_d_d7a.py
          grep -q "T2_PRIMARY_RESCUE_WITH_GUARDRAIL_TENSION" gate_d_d7a.py
          grep -q "T3_PARTIAL_W2_TRAJECTORY_RESCUE" gate_d_d7a.py
          grep -q "T0_NO_W2_TRAJECTORY_RESCUE" gate_d_d7a.py
          grep -q "TX_ORACLE_INTERPRETATION_INVALID" gate_d_d7a.py
          grep -q "time-matched safe-W2 clamp" GATE_D7A_PROTOCOL.md
          grep -q "No W2×FF1 arm" GATE_D7A_PROTOCOL.md
          test -f d6a_source/result/D6A_SUMMARY.json
          test -f d6a_source/result/D6A_EFFECT_ARRAYS.npz
          test -f d6a_source/result/D6A_F_EM_terminal.pkl
          test -f d6a_source/result/D6A_F_EM_WO_zero_bo_oracle_terminal.pkl
          test -f d6a1_source/result/D6A1_SUMMARY.json
          test -f d6a2_source/result/D6A2_SUMMARY.json
          test -f d6a3_source/result/D6A3_SUMMARY.json
          test -f d3e_anchor/result/HISTORICAL_R6B3_R3_T8_REFERENCE_TRACE.json
      - name: Run Gate D7A
        working-directory: snn_transform_r6
        shell: bash
        env:
          PYTHONPATH: ../snn_transform_p3_image:.
        run: |
          set -euo pipefail
          mkdir -p run_gate_d7a/result
          python gate_d_d7a.py \
            --data run_gate_d7a/mnist.npz \
            --tokenizer frozen_r6b1/result/tokenizer.pt \
            --checkpoint prior_g2/result/checkpoint_2p0000epoch.pkl \
            --d6a-artifact d6a_source \
            --d6a1-artifact d6a1_source \
            --d6a2-artifact d6a2_source \
            --d6a3-artifact d6a3_source \
            --anchor-artifact d3e_anchor \
            --out run_gate_d7a/result \
            --contexts 1024 --eval-images 256 --gen-samples 256 --bootstrap 10000 \
            --encode-batch 256 --seed 7311 --threads 4 \
            | tee run_gate_d7a/console.log
      - name: Show compact D7A result
        if: always()
        working-directory: snn_transform_r6
        run: |
          python - <<'PY'
          import json, pathlib
          f=pathlib.Path('run_gate_d7a/result/D7A_SUMMARY.json')
          if not f.exists():
              print('D7A_SUMMARY.json not produced')
          else:
              d=json.load(open(f))
              print(json.dumps({
                  'classification':d.get('classification'),
                  'primary':d.get('decision',{}).get('primary_C_minus_B_significant_improvement'),
                  'gap_closure':{k:v for k,v in d.get('gap_closure',{}).items() if k in ('F61','D_non61')},
                  'guardrails':d.get('guardrails'),
                  'oracle_valid':d.get('oracle_valid'),
                  'clamp':d.get('W2_clamp'),
              },indent=2))
          PY
      - name: Upload Gate D7A artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SNN_TRANSFORM_GATE_D7A_SAFE_W2_TRAJECTORY_CLAMP
          path: |
            snn_transform_r6/run_gate_d7a/result/
            snn_transform_r6/run_gate_d7a/console.log
          if-no-files-found: warn
          retention-days: 30

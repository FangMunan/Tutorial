name: SNN Transform U4 Sparse Tail

on:
  workflow_dispatch:
  push:
    branches:
      - snn-transform-u4-sparse-tail-20261014
    paths:
      - 'unified_snn_transform/run_u4_sparse_tail.py'
      - '.github/workflows/u4_sparse_tail.yml'

jobs:
  u4-sparse-tail:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile
        run: python -m py_compile unified_snn_transform/run_u4_sparse_tail.py
      - name: Run U4 sparse tail gate
        run: |
          mkdir -p unified_snn_transform/run/U4
          python unified_snn_transform/run_u4_sparse_tail.py \
            --out unified_snn_transform/run/U4 \
            --tokens 16 --d 32 --ff 64 \
            --steps 900 --batch 256 \
            --eval-batches 8 --eval-batch 256 \
            --target-activity 0.25 --activity-lambda 0.05 \
            --rel-gate 0.08 --cos-gate 0.995 --eff-gate 0.45 \
            --seed 41 --threads 4 | tee unified_snn_transform/run/U4/run.log
      - name: Show result summary
        run: |
          python - <<'PY'
          import json
          p='unified_snn_transform/run/U4/U4_RESULTS.json'
          d=json.load(open(p))
          print(json.dumps({'stage':d['stage'],'PASS':d['PASS'],'best_passing':d['best_passing'],'decision':d['decision']},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: SNN_TRANSFORM_U4_SPARSE_TAIL
          path: unified_snn_transform/run/U4
          retention-days: 30

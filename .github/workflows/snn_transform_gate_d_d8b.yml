name: SNN Transform Gate D8B causal functional mode

on:
  push:
    branches:
      - gate-d-plasticity-spectrum-audit
    paths:
      - 'snn_transform_r6/gate_d_d8b.py'
      - 'snn_transform_r6/GATE_D8B_PROTOCOL.md'
      - '.github/workflows/snn_transform_gate_d_d8b.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  d8b-causal-functional-mode:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy torch scikit-learn scipy scikit-image matplotlib numba

      - name: Download successful D6A artifact
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_GATE_D6A_PATHWAY_SPECIFIC_REPAIR
          path: snn_transform_r6/d6a_source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39687028646

      - name: Download successful D7A artifact
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_GATE_D7A_SAFE_W2_TRAJECTORY_CLAMP
          path: snn_transform_r6/d7a_source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39871827217

      - name: Download successful D7A.2 artifact
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_GATE_D7A2_B2_BO_STOPPING_GATE
          path: snn_transform_r6/d7a2_source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39942308903

      - name: Download successful D8A artifact
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_GATE_D8A_FUNCTIONAL_MODE_IDENTIFICATION
          path: snn_transform_r6/d8a_source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39979543621

      - name: Download frozen D3E execution anchor
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_D3E_R6B4_NATIVE_EXECUTION_ANCHOR
          path: snn_transform_r6/d3e_anchor
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39450940230

      - name: Static audit
        working-directory: snn_transform_r6
        shell: bash
        env:
          PYTHONPATH: ../snn_transform_p3_image:.
        run: |
          set -euo pipefail
          python -m py_compile gate_d_d8b.py gate_d_d8a.py gate_d_d7a2.py gate_d_d7a1.py gate_d_d6a.py r6b4_full_forward_plasticity.py
          python - <<'PY'
          import pathlib
          import p3i_cb_exact_msdl, gate_d_d8b
          p = pathlib.Path('GATE_D8B_PROTOCOL.md').read_text(encoding='utf-8')
          src = pathlib.Path('gate_d_d8b.py').read_text(encoding='utf-8')
          pl = p.lower()
          assert 'privileged matched-counterfactual causal upper bound' in pl
          assert 'discovery-fixed amplitude' in pl
          assert 'sign flip' in pl
          assert 'B1_BIDIRECTIONAL_CAUSAL_HARMFUL_FUNCTIONAL_MODE' in src
          assert 'B2_RESCUE_ONLY_FUNCTIONAL_MODE' in src
          assert 'B3_ADDITION_ONLY_FUNCTIONAL_MODE' in src
          assert 'B4_DESCRIPTIVE_ONLY_FUNCTIONAL_MODE' in src
          assert 'D8B_frozen_y_pair_basis' in src
          print('D8B import/static smoke PASS')
          PY
          test -f d6a_source/result/D6A_F_EM_WO_zero_bo_oracle_terminal.pkl
          test -f d7a_source/result/D7A_F_terminal.pkl
          test -f d7a_source/result/D7A_C_W2_safe_clamp_terminal.pkl
          test -f d7a2_source/result/D7A2_SUMMARY.json
          test -f d7a2_source/result/D7A2_EFFECT_ARRAYS.npz
          test -f d8a_source/result/D8A_SUMMARY.json
          test -f d8a_source/result/D8A_MODES.npz
          test -f d3e_anchor/result/HISTORICAL_R6B3_R3_T8_REFERENCE_TRACE.json

      - name: Run Gate D8B
        working-directory: snn_transform_r6
        shell: bash
        env:
          PYTHONPATH: ../snn_transform_p3_image:.
        run: |
          set -euo pipefail
          mkdir -p run_gate_d8b/result
          python gate_d_d8b.py \
            --d6a-artifact d6a_source \
            --d7a-artifact d7a_source \
            --d7a2-artifact d7a2_source \
            --d8a-artifact d8a_source \
            --anchor-artifact d3e_anchor \
            --out run_gate_d8b/result \
            --bootstrap 10000 --seed 7311 --threads 4 \
            | tee run_gate_d8b/console.log

      - name: Show compact D8B result
        if: always()
        working-directory: snn_transform_r6
        run: |
          python - <<'PY'
          import json, pathlib
          f = pathlib.Path('run_gate_d8b/result/D8B_SUMMARY.json')
          if not f.exists():
              print('D8B_SUMMARY.json not produced')
          else:
              d = json.load(open(f))
              P = ('F61','D_non61')
              print(json.dumps({
                  'classification': d.get('classification'),
                  'loads': {m:d.get('total_compensation_load',{}).get(m) for m in P},
                  'removal': {m:d.get('matched_removal_Cminus_vs_C',{}).get(m) for m in P},
                  'addition': {m:d.get('matched_addition_Rplus_vs_R',{}).get(m) for m in P},
                  'capture_removal': {m:d.get('matched_removal_load_capture',{}).get(m) for m in P},
                  'capture_addition': {m:d.get('matched_addition_load_capture',{}).get(m) for m in P},
                  'orientation': d.get('orientation_control'),
                  'fixed_removal': {m:d.get('fixed_amplitude_Cminus_vs_C',{}).get(m) for m in P},
                  'fixed_addition': {m:d.get('fixed_amplitude_Rplus_vs_R',{}).get(m) for m in P},
                  'fixed_support': d.get('fixed_amplitude_support'),
                  'a_disc': d.get('discovery_fixed_amplitude'),
                  'decision': d.get('decision'),
              }, indent=2))
          PY

      - name: Upload Gate D8B artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SNN_TRANSFORM_GATE_D8B_CAUSAL_FUNCTIONAL_MODE
          path: |
            snn_transform_r6/run_gate_d8b/result/
            snn_transform_r6/run_gate_d8b/console.log
          if-no-files-found: warn
          retention-days: 30

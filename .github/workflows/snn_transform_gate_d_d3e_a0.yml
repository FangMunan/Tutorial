name: SNN Transform Gate D3E-A0 Gate-A provenance recovery

on:
  push:
    branches:
      - gate-d-plasticity-spectrum-audit
    paths:
      - 'snn_transform_r6/gate_d_d3e_a0.py'
      - '.github/workflows/snn_transform_gate_d_d3e_a0.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  d3e-a0:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy torch scikit-learn scipy scikit-image matplotlib numba
      - name: Download frozen R6B1 SNN tokenizer
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_R6B1_TUNE_a075_t8
          path: snn_transform_r6/frozen_r6b1
          github-token: ${{ github.token }}
          run-id: 39139040624
      - name: Download exact R6B3 two-epoch checkpoint
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_R6B3_G2_TWO_EPOCHS
          path: snn_transform_r6/prior_g2
          github-token: ${{ github.token }}
          run-id: 39170815102
      - name: Download exact historical R6B4 effectiveness artifact
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_R6B4_FULL_FORWARD_EFFECTIVENESS_TEST
          path: snn_transform_r6/prior_effectiveness
          github-token: ${{ github.token }}
          run-id: 39230496177
      - name: Download MNIST
        working-directory: snn_transform_r6
        run: |
          mkdir -p run_gate_d3e_a0
          python - <<'PY'
          import urllib.request
          urllib.request.urlretrieve(
              'https://storage.googleapis.com/tensorflow/tf-keras-datasets/mnist.npz',
              'run_gate_d3e_a0/mnist.npz')
          PY
      - name: Static audit
        working-directory: snn_transform_r6
        run: |
          set -euo pipefail
          python -m py_compile gate_d_d3e_a0.py
          grep -q 'UNIFORM_SEED = 9917311' gate_d_d3e_a0.py
          grep -q 'SELECTION_SEED = 11553' gate_d_d3e_a0.py
          grep -q '5b69d8fa4a8b1fef2939230014d002731bf4814aa55bfc542eee9edcddc20dd1' gate_d_d3e_a0.py
          grep -q 'Do not require causal replay sampled IDs' gate_d_d3e_a0.py
      - name: Run D3E-A0 only
        working-directory: snn_transform_r6
        run: |
          set -euo pipefail
          python gate_d_d3e_a0.py \
            --data run_gate_d3e_a0/mnist.npz \
            --tokenizer frozen_r6b1/result/tokenizer.pt \
            --checkpoint prior_g2/result/checkpoint_2p0000epoch.pkl \
            --effectiveness prior_effectiveness \
            --out run_gate_d3e_a0/result \
            --threads 4 \
            | tee run_gate_d3e_a0/console.log
      - name: Show result
        if: always()
        working-directory: snn_transform_r6
        run: |
          python - <<'PY'
          import json, pathlib
          f=pathlib.Path('run_gate_d3e_a0/result/D3E_A0_PROVENANCE.json')
          if f.exists():
              d=json.load(open(f))
              print(json.dumps({
                  'pass': d.get('pass'),
                  'provenance': d.get('provenance'),
                  'terminal_state': d.get('terminal_state'),
                  'reference_trace_gate': d.get('reference_trace_gate'),
                  'reconstructed_effects': d.get('reconstructed_effects'),
                  'abs_diff': d.get('abs_diff'),
              }, indent=2))
          else:
              print('D3E_A0_PROVENANCE.json not produced')
          PY
      - name: Upload D3E-A0 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SNN_TRANSFORM_GATE_D3E_A0_PROVENANCE
          path: |
            snn_transform_r6/run_gate_d3e_a0/result/
            snn_transform_r6/run_gate_d3e_a0/console.log
          if-no-files-found: warn
          retention-days: 30

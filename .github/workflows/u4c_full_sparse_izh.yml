name: SNN Transform U4C Full Sparse Izh

on:
  workflow_dispatch:
  push:
    branches:
      - snn-transform-u4-sparse-tail-20261014
    paths:
      - 'unified_snn_transform/run_u4c_full_sparse_izh.py'
      - '.github/workflows/u4c_full_sparse_izh.yml'

jobs:
  u4c:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile
        run: python -m py_compile unified_snn_transform/run_u4c_full_sparse_izh.py
      - name: Run U4C integration gate
        run: |
          mkdir -p unified_snn_transform/run/U4C
          python unified_snn_transform/run_u4c_full_sparse_izh.py \
            --out unified_snn_transform/run/U4C \
            --tokens 16 --d 32 --heads 2 --features 32 --ff 64 --value-dim 8 \
            --train-steps 900 --train-batch 128 \
            --eval-batches 8 --eval-batch 128 --topn 12 \
            --seed 71 --threads 4 | tee unified_snn_transform/run/U4C/run.log
      - name: Show result
        if: always()
        run: |
          python - <<'PY'
          import json,os
          p='unified_snn_transform/run/U4C/U4C_RESULTS.json'
          if os.path.exists(p):
              d=json.load(open(p))
              keep={'stage':d['stage'],'PASS':d['PASS'],'gates':d['gates'],
                    'exact_sparse_task':d['exact_sparse_task'],'tail_compute':d['tail_compute'],
                    'heldout_izh_parity':d['heldout_izh_parity'],'decision':d['decision']}
              print(json.dumps(keep,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SNN_TRANSFORM_U4C_FULL_SPARSE_IZH
          path: unified_snn_transform/run/U4C
          retention-days: 30

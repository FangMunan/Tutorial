name: H2 Resident Cache Audit

on:
  push:
    branches: [h2-resident-mapping-prep-20261010]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy scikit-learn torch torchvision
      - name: Download frozen H1-B artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p h2_spinnaker/reuse/H1B
          gh run download 37980789193 --repo FangMunan/Tutorial --name H1B_IZH_RESULTS --dir h2_spinnaker/reuse/H1B
      - name: Download B2.1 calibration artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p h2_spinnaker/reuse/B21
          gh run download 37998819624 --repo FangMunan/Tutorial --name H1B21_QK_LAYER_SCAN --dir h2_spinnaker/reuse/B21
      - name: Compile audit
        run: |
          python -m py_compile h2_spinnaker/h2_block1_cache_audit.py
      - name: Run audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p h2_spinnaker/run/H2_CACHE_AUDIT
          python h2_spinnaker/h2_block1_cache_audit.py \
            --h1b h2_spinnaker/reuse/H1B \
            --b21 h2_spinnaker/reuse/B21 \
            --out h2_spinnaker/run/H2_CACHE_AUDIT | tee h2_spinnaker/run/H2_CACHE_AUDIT/run.log
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: H2_CACHE_AUDIT
          path: h2_spinnaker/run/H2_CACHE_AUDIT
          retention-days: 14

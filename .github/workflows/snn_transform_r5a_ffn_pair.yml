name: SNN Transform R5A Joint FFN Recovery

on:
  push:
    branches: [camp4]
    paths:
      - 'snn_transform_r5/RUN_TRIGGER_R5A'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  r5a_ffn_pair:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: camp4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy torch scikit-learn matplotlib
      - name: Recover B0 checkpoint and codebook from E29
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p snn_transform_r5/run_r5a
          gh run download 38964779791 \
            --repo FangMunan/Tutorial \
            --name SNN_TRANSFORM_E29_FORWARD_EQUIVALENCE \
            --dir snn_transform_r5/run_r5a/e29_source
          test -f snn_transform_r5/run_r5a/e29_source/b0/best.pt
          test -f snn_transform_r5/run_r5a/e29_source/b0/codebook.npy
      - name: Download MNIST
        working-directory: snn_transform_r5
        run: |
          python - <<'PY'
          import urllib.request
          urllib.request.urlretrieve('https://storage.googleapis.com/tensorflow/tf-keras-datasets/mnist.npz','run_r5a/mnist.npz')
          PY
      - name: Static gradient-free audit
        working-directory: snn_transform_r5
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile r5a_ffn_pair_recovery.py
          if grep -nE '\.backward\(|torch\.optim' r5a_ffn_pair_recovery.py; then
            echo 'Forbidden backprop/torch.optim API found'; exit 1
          fi
      - name: Run R5A joint FFN recovery
        working-directory: snn_transform_r5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run_r5a/result
          python r5a_ffn_pair_recovery.py \
            --data run_r5a/mnist.npz \
            --checkpoint run_r5a/e29_source/b0/best.pt \
            --codebook run_r5a/e29_source/b0/codebook.npy \
            --out run_r5a/result \
            --features 256 \
            --rf-kind p3norm \
            --rf-seed 29257 \
            --epochs 8 \
            --batch 128 \
            --lr1 0.10 \
            --lr2 0.16 \
            --sigma1 0.05 \
            --sigma2 0.05 \
            --threads 2 | tee run_r5a/r5a_console.log
      - name: Show R5A metrics
        if: always()
        working-directory: snn_transform_r5
        run: |
          if [ -f run_r5a/result/metrics.json ]; then cat run_r5a/result/metrics.json; fi
      - name: Upload R5A artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SNN_TRANSFORM_R5A_FFN_PAIR_RECOVERY
          path: |
            snn_transform_r5/run_r5a/result/metrics.json
            snn_transform_r5/run_r5a/result/history.csv
            snn_transform_r5/run_r5a/result/recovery_checkpoint.pt
            snn_transform_r5/run_r5a/result/*.png
            snn_transform_r5/run_r5a/r5a_console.log
          if-no-files-found: warn
          retention-days: 30

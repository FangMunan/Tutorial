name: SNN Transform R6B3 G0 context epoch

on:
  workflow_dispatch:
    inputs:
      fractional_epoch:
        description: Additional context-epoch equivalent to train
        required: true
        default: '0.25'
      eval_images:
        description: Validation images per fixed mask-ratio evaluation
        required: true
        default: '128'
      gen_samples:
        description: Unconditional samples for each 8/16-round decode
        required: true
        default: '36'

permissions:
  contents: read
  actions: read

jobs:
  g0:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r6b3-g0-training-v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy torch scikit-learn scipy scikit-image matplotlib numba

      - name: Download frozen R6B1 SNN tokenizer
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_R6B1_TUNE_a075_t8
          path: snn_transform_r6/frozen_r6b1
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39139040624

      - name: Download MNIST
        working-directory: snn_transform_r6
        run: |
          mkdir -p run_r6b3_g0
          python - <<'PY'
          import urllib.request
          urllib.request.urlretrieve(
              'https://storage.googleapis.com/tensorflow/tf-keras-datasets/mnist.npz',
              'run_r6b3_g0/mnist.npz')
          PY

      - name: Static audit
        working-directory: snn_transform_r6
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            maskgit_input_representation.py \
            maskgit_scheduled_parallel.py \
            maskgit_msdl_training.py \
            maskgit_msdl_training_unconditional.py \
            r6b1_spiking_tokenizer.py \
            r6b2_snn_encoder_p3_msdl.py \
            r6b3_snn_encoder_maskgit_msdl.py \
            r6b3_context_epoch_training.py \
            ../snn_transform_p3_image/p3i_cb_exact_msdl.py
          test -f frozen_r6b1/result/tokenizer.pt
          grep -q 'learn_mask_batch' r6b3_context_epoch_training.py
          grep -q 'context_from_arr_unconditional' r6b3_context_epoch_training.py
          grep -q 'checkpoint_roundtrip_audit' r6b3_context_epoch_training.py
          grep -q 'for iters in (8,16)' r6b3_context_epoch_training.py
          grep -q 'p1g_reintroduced.:False' r6b3_context_epoch_training.py

      - name: Run G0 context-epoch training
        working-directory: snn_transform_r6
        shell: bash
        run: |
          set -euo pipefail
          OUT=run_r6b3_g0/result
          mkdir -p "$OUT"
          python r6b3_context_epoch_training.py \
            --data run_r6b3_g0/mnist.npz \
            --tokenizer frozen_r6b1/result/tokenizer.pt \
            --out "$OUT" \
            --fractional-epoch "${{ inputs.fractional_epoch || '0.25' }}" \
            --D 96 --heads 8 --features 24 --ff 192 --R 7 \
            --scaffold-contexts 2000 --scaffold-paths 2500 --scaffold-lr 0.6 \
            --internal-lr-scale 0.5 \
            --eval-images "${{ inputs.eval_images || '128' }}" \
            --gen-samples "${{ inputs.gen_samples || '36' }}" \
            --choice-temperature 4.5 \
            --encode-batch 256 \
            --report-every-contexts 500 \
            --seed 7311 --threads 4 | tee run_r6b3_g0/console.log

      - name: Show concise result
        if: always()
        working-directory: snn_transform_r6
        run: |
          test -f run_r6b3_g0/result/G0_RESULTS.json && python - <<'PY'
          import json
          p='run_r6b3_g0/result/G0_RESULTS.json'
          d=json.load(open(p))
          print(json.dumps({
            'meta':d['meta'],
            'primary_comparison':d['primary_comparison'],
            'all_system_arrays_finite':d['all_system_arrays_finite'],
            'checkpoint_roundtrip_pass':d['checkpoint_roundtrip_audit']['pass'],
            'relative_weight_move_this_run':d['relative_weight_move_this_run'],
            'mean_abs_reciprocal':d['mean_abs_reciprocal'],
          },indent=2))
          PY

      - name: Upload G0 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SNN_TRANSFORM_R6B3_G0_CONTEXT_EPOCH
          path: |
            snn_transform_r6/run_r6b3_g0/result/
            snn_transform_r6/run_r6b3_g0/console.log
          if-no-files-found: warn
          retention-days: 30

name: SNN Transform R6B3 MaskGIT Train and Decode

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  r6b3:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: camp4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy torch scikit-learn scipy scikit-image matplotlib numba

      - name: Download frozen R6B1 SNN tokenizer
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_R6B1_TUNE_a075_t8
          path: snn_transform_r6/frozen_r6b1
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39139040624

      - name: Download MNIST
        working-directory: snn_transform_r6
        run: |
          mkdir -p run_r6b3
          python - <<'PY'
          import urllib.request
          urllib.request.urlretrieve(
              'https://storage.googleapis.com/tensorflow/tf-keras-datasets/mnist.npz',
              'run_r6b3/mnist.npz')
          PY

      - name: Static audit
        working-directory: snn_transform_r6
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            maskgit_input_representation.py \
            maskgit_scheduled_parallel.py \
            maskgit_msdl_training.py \
            maskgit_msdl_training_unconditional.py \
            r6b1_spiking_tokenizer.py \
            r6b2_snn_encoder_p3_msdl.py \
            r6b3_snn_encoder_maskgit_msdl.py \
            ../snn_transform_p3_image/p3i_cb_exact_msdl.py
          test -f frozen_r6b1/result/tokenizer.pt

          # Generation must remain MaskGIT scheduled-parallel.
          grep -q 'scheduled_parallel_decode' r6b3_snn_encoder_maskgit_msdl.py
          if grep -q 'rng.permutation(cfg.N)' r6b3_snn_encoder_maskgit_msdl.py; then
            echo 'ERROR: old sequential random-permutation generation/training found in R6B3'
            exit 1
          fi

          # Training must use one random MaskGIT mask set and all masked targets.
          grep -q 'train_maskgit_msdl_unconditional' r6b3_snn_encoder_maskgit_msdl.py
          if grep -q 'core.train_full' r6b3_snn_encoder_maskgit_msdl.py; then
            echo 'ERROR: legacy sequential-reveal P3 train_full is still called'
            exit 1
          fi

          # Item-2 guard: no historical random embedding builder and no class input.
          grep -q 'build_input_embeddings' r6b3_snn_encoder_maskgit_msdl.py
          grep -q 'context_from_arr_unconditional' r6b3_snn_encoder_maskgit_msdl.py
          if grep -q 'core.build_embeddings' r6b3_snn_encoder_maskgit_msdl.py; then
            echo 'ERROR: fixed-random P3 embedding builder reintroduced'
            exit 1
          fi
          if grep -q 'class_conditioning_retained.:True' r6b3_snn_encoder_maskgit_msdl.py; then
            echo 'ERROR: class conditioning reintroduced'
            exit 1
          fi

      - name: Run R6B3 MaskGIT-aligned training and generation
        working-directory: snn_transform_r6
        shell: bash
        run: |
          set -euo pipefail
          OUT=run_r6b3/result
          mkdir -p "$OUT"
          python r6b3_snn_encoder_maskgit_msdl.py \
            --data run_r6b3/mnist.npz \
            --tokenizer frozen_r6b1/result/tokenizer.pt \
            --out "$OUT" \
            --D 96 \
            --heads 8 \
            --features 24 \
            --ff 192 \
            --R 7 \
            --scaffold-contexts 2000 \
            --scaffold-paths 2500 \
            --scaffold-lr 0.6 \
            --events 30000 \
            --eval-images 128 \
            --gen-samples 36 \
            --internal-lr-scale 0.5 \
            --encode-batch 256 \
            --decode-iterations 8 \
            --choice-temperature 4.5 \
            --seed 7311 \
            --report-every 5000 \
            --threads 4 | tee run_r6b3/console.log

      - name: Show result
        if: always()
        working-directory: snn_transform_r6
        run: |
          test -f run_r6b3/result/metrics.json && cat run_r6b3/result/metrics.json || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SNN_TRANSFORM_R6B3_MASKGIT_TRAIN_AND_DECODE
          path: |
            snn_transform_r6/run_r6b3/result/metrics.json
            snn_transform_r6/run_r6b3/result/generation_scaffold.png
            snn_transform_r6/run_r6b3/result/generation_final.png
            snn_transform_r6/run_r6b3/result/final_state.npz
            snn_transform_r6/run_r6b3/result/generated_tokens_scaffold.csv
            snn_transform_r6/run_r6b3/result/generated_tokens_final.csv
            snn_transform_r6/run_r6b3/result/history.csv
            snn_transform_r6/run_r6b3/result/maskgit_training_audit.json
            snn_transform_r6/run_r6b3/result/maskgit_trace_scaffold.json
            snn_transform_r6/run_r6b3/result/maskgit_trace_final.json
            snn_transform_r6/run_r6b3/result/maskgit_audit_scaffold.json
            snn_transform_r6/run_r6b3/result/maskgit_audit_final.json
            snn_transform_r6/run_r6b3/console.log
          if-no-files-found: warn
          retention-days: 30

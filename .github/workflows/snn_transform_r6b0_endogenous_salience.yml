name: SNN Transform R6B0 Endogenous Salience

on:
  workflow_dispatch:
  push:
    branches: [camp4]
    paths:
      - 'snn_transform_r6/RUN_TRIGGER_R6B0'

permissions:
  contents: read
  actions: read

jobs:
  r6b0_endogenous_salience:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: camp4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy torch scikit-learn matplotlib
      - name: Recover B0 checkpoint and codebook from E29
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p snn_transform_r6/run_r6b0/e29_source
          gh run download 38964779791 \
            --repo FangMunan/Tutorial \
            --name SNN_TRANSFORM_E29_FORWARD_EQUIVALENCE \
            --dir snn_transform_r6/run_r6b0/e29_source
          test -f snn_transform_r6/run_r6b0/e29_source/b0/best.pt
          test -f snn_transform_r6/run_r6b0/e29_source/b0/codebook.npy
      - name: Recover R6A2 CB positive-control checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p snn_transform_r6/run_r6b0/r6a2_cb
          gh run download 39049439706 \
            --repo FangMunan/Tutorial \
            --name SNN_TRANSFORM_R6A2_cb \
            --dir snn_transform_r6/run_r6b0/r6a2_cb
          test -f snn_transform_r6/run_r6b0/r6a2_cb/result/recovery_checkpoint.pt
      - name: Download MNIST
        working-directory: snn_transform_r6
        run: |
          python - <<'PY'
          import urllib.request
          urllib.request.urlretrieve(
              'https://storage.googleapis.com/tensorflow/tf-keras-datasets/mnist.npz',
              'run_r6b0/mnist.npz')
          PY
      - name: Static no-learning audit
        working-directory: snn_transform_r6
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile r6b0_endogenous_salience.py r6a_four_block_recovery.py
          python - <<'PY'
          import ast
          from pathlib import Path
          fn='r6b0_endogenous_salience.py'
          tree=ast.parse(Path(fn).read_text())
          bad=[]
          for node in ast.walk(tree):
              if isinstance(node, ast.Call):
                  parts=[]; cur=node.func
                  while isinstance(cur, ast.Attribute):
                      parts.append(cur.attr); cur=cur.value
                  if isinstance(cur, ast.Name): parts.append(cur.id)
                  name='.'.join(reversed(parts))
                  if name.endswith('.backward') or name=='backward' or name.startswith('torch.optim'):
                      bad.append((node.lineno,name))
          if bad:
              print('Forbidden training API:',bad)
              raise SystemExit(1)
          print('R6B0 static no-learning audit passed')
          PY
      - name: Run R6B0 endogenous salience diagnostic
        working-directory: snn_transform_r6
        shell: bash
        run: |
          set -euo pipefail
          OUT=run_r6b0/result
          mkdir -p "$OUT"
          python r6b0_endogenous_salience.py \
            --data run_r6b0/mnist.npz \
            --checkpoint run_r6b0/e29_source/b0/best.pt \
            --codebook run_r6b0/e29_source/b0/codebook.npy \
            --recovered-checkpoint run_r6b0/r6a2_cb/result/recovery_checkpoint.pt \
            --out "$OUT" \
            --features 256 \
            --rf-kind p3norm \
            --rf-seed 29257 \
            --ratios 0.25,0.5,0.9,1.0 \
            --probe-limit 1536 \
            --batch 128 \
            --threads 2 \
            --seed 6101 | tee run_r6b0/console.log
      - name: Show summary
        if: always()
        working-directory: snn_transform_r6
        run: |
          P=run_r6b0/result/summary.json
          if [ -f "$P" ]; then cat "$P"; fi
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SNN_TRANSFORM_R6B0_ENDOGENOUS_SALIENCE
          path: |
            snn_transform_r6/run_r6b0/result/summary.json
            snn_transform_r6/run_r6b0/result/salience_cells.csv
            snn_transform_r6/run_r6b0/console.log
          if-no-files-found: warn
          retention-days: 30

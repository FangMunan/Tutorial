name: SNN Transform R6B1 Spiking Sensory Tokenizer

on:
  workflow_dispatch:
  push:
    branches: [camp4]
    paths:
      - 'snn_transform_r6/RUN_TRIGGER_R6B1'

permissions:
  contents: read
  actions: read

jobs:
  tokenizer_gate:
    strategy:
      fail-fast: false
      matrix:
        model: [kmeans, ann, snn]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: camp4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy torch scikit-learn scipy scikit-image matplotlib
      - name: Download MNIST
        working-directory: snn_transform_r6
        run: |
          mkdir -p run_r6b1_${{ matrix.model }}
          python - <<'PY'
          import urllib.request
          urllib.request.urlretrieve('https://storage.googleapis.com/tensorflow/tf-keras-datasets/mnist.npz','run_r6b1_${{ matrix.model }}/mnist.npz')
          PY
      - name: Static audit
        working-directory: snn_transform_r6
        run: |
          python -m py_compile r6b1_spiking_tokenizer.py
      - name: Run tokenizer gate
        working-directory: snn_transform_r6
        shell: bash
        run: |
          set -euo pipefail
          OUT=run_r6b1_${{ matrix.model }}/result
          mkdir -p "$OUT"
          python r6b1_spiking_tokenizer.py \
            --model ${{ matrix.model }} \
            --data run_r6b1_${{ matrix.model }}/mnist.npz \
            --out "$OUT" \
            --n-per-class 1200 \
            --test-per-class 400 \
            --epochs 12 \
            --batch 96 \
            --lr 0.002 \
            --dim 16 \
            --steps 8 \
            --alpha 0.5 \
            --sensory-gain 1.6 \
            --beta 0.85 \
            --commitment 0.25 \
            --entropy-weight 0.02 \
            --entropy-temp 0.5 \
            --threads 4 \
            --seed 6201 | tee run_r6b1_${{ matrix.model }}/console.log
      - name: Show metrics
        if: always()
        working-directory: snn_transform_r6
        run: |
          test -f run_r6b1_${{ matrix.model }}/result/metrics.json && cat run_r6b1_${{ matrix.model }}/result/metrics.json || true
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SNN_TRANSFORM_R6B1_${{ matrix.model }}
          path: |
            snn_transform_r6/run_r6b1_${{ matrix.model }}/result/metrics.json
            snn_transform_r6/run_r6b1_${{ matrix.model }}/result/reconstruction.png
            snn_transform_r6/run_r6b1_${{ matrix.model }}/result/tokenizer.pt
            snn_transform_r6/run_r6b1_${{ matrix.model }}/console.log
          if-no-files-found: warn
          retention-days: 30

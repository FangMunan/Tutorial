name: H1 Full Dynamics Fusion

on:
  push:
    branches:
      - h1-full-dynamics-fusion-20261009
    paths:
      - 'h1_cloud/**'
      - '.github/workflows/h1_mnist_fusion.yml'
  workflow_dispatch:

jobs:
  h1-fusion:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy scikit-learn torch torchvision

      - name: Compile H1 sources
        run: |
          python -m py_compile h1_cloud/h0_base.py h1_cloud/h1_sparse_fusion.py

      - name: Run H1 MNIST fusion gate
        run: |
          mkdir -p h1_cloud/run/H1_FUSION
          python h1_cloud/h1_sparse_fusion.py \
            --out h1_cloud/run/H1_FUSION \
            --n-per-class 2000 \
            --epochs-linear 18 \
            --gate-epochs 2 \
            --batch 256 \
            --d 128 \
            --layers 4 \
            --heads 4 \
            --ff 512 \
            --features 128 \
            --steps 10 \
            --temp 0.25 \
            --eval-n 300 \
            --ref-epochs 3 \
            --seed 7 \
            --threads 4 | tee h1_cloud/run/H1_FUSION/run.log

      - name: Show H1 summary
        if: always()
        run: |
          if [ -f h1_cloud/run/H1_FUSION/H1_RESULTS.json ]; then
            python - <<'PY'
          import json
          p='h1_cloud/run/H1_FUSION/H1_RESULTS.json'
          d=json.load(open(p))
          print(json.dumps({
            'stage': d.get('stage'),
            'reference_classifier_test_acc': d.get('reference_classifier_test_acc'),
            'audits': d.get('audits'),
            'generation': d.get('generation'),
            'claims': d.get('claims'),
            'selective_gate': d.get('selective_gate'),
          }, indent=2))
          PY
          fi

      - name: Upload H1 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: H1_FUSION_RESULTS
          path: h1_cloud/run/H1_FUSION
          if-no-files-found: warn
          retention-days: 14

name: H6-B ionic mask non-inferiority

on:
  workflow_dispatch:
  push:
    branches:
      - h6b-ionic-mask-noninferiority-20261012

jobs:
  ionic_mask_test:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy matplotlib scikit-learn
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Download H6-A frozen software artifact
        uses: actions/download-artifact@v4
        with:
          name: H6_PIXEL784_STANDARD_RESULTS
          path: INPUT_STANDARD
          github-token: ${{ github.token }}
          repository: FangMunan/Tutorial
          run-id: 38237473453

      - name: Download bounded-optimization artifact
        uses: actions/download-artifact@v4
        with:
          name: H6_BOUNDED_OPT_RESULTS
          path: INPUT_BOUNDED
          github-token: ${{ github.token }}
          repository: FangMunan/Tutorial
          run-id: 38262603694

      - name: Reconstruct and audit canonical ionic input
        run: |
          test -f data/PGI_ionic_binary.npz.b64 || {
            echo 'ERROR: canonical ionic base64 transport is missing.' >&2
            exit 2
          }
          base64 -d data/PGI_ionic_binary.npz.b64 > data/PGI_ionic_binary.npz
          ACTUAL=$(sha256sum data/PGI_ionic_binary.npz | awk '{print $1}')
          EXPECTED='e1a15af265db3af8ceae998ef7aaff1ea73cb55083e7b727ba0ae550029d16e8'
          echo "ionic_sha256=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED" || {
            echo "ERROR: canonical ionic SHA256 mismatch" >&2
            exit 2
          }
          python - <<'PY'
          import numpy as np
          p='data/PGI_ionic_binary.npz'
          d=np.load(p,allow_pickle=False)
          assert set(d.files)=={'bits_concat','sequence_ids','sequence_offsets'}, d.files
          bits=np.asarray(d['bits_concat'],dtype=np.uint8)
          ids=np.asarray(d['sequence_ids']).astype(str)
          off=np.asarray(d['sequence_offsets'],dtype=np.int64)
          assert bits.ndim==1 and np.all(np.isin(np.unique(bits),[0,1]))
          assert len(off)==len(ids)+1 and off[0]==0 and off[-1]==len(bits)
          print('keys=',d.files)
          print('ids=',ids.tolist())
          print('offsets=',off.tolist())
          print('lengths=',np.diff(off).tolist())
          print('one_fractions=',[float(bits[off[i]:off[i+1]].mean()) for i in range(len(ids))])
          PY

      - name: Run matched H6-B replacement test
        run: |
          python h6_pixel784/test_h6b_ionic_mask.py \
            --standard-dir INPUT_STANDARD \
            --bounded-dir INPUT_BOUNDED \
            --ionic data/PGI_ionic_binary.npz \
            --out H6B_IONIC_MASK \
            --n 1000 --steps 96 --temperature 3.5 \
            --gen-batch 32 --threads 4 --seed 7 \
            | tee H6B_IONIC_MASK.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: H6B_IONIC_MASK_RESULTS
          path: |
            H6B_IONIC_MASK
            H6B_IONIC_MASK.log
          retention-days: 30

name: SNN Transform MaskGIT restart static audit

on:
  push:
    branches:
      - gate-d-plasticity-spectrum-audit
    paths:
      - '.github/workflows/snn_transform_maskgit_restart_static_audit.yml'
      - 'snn_transform_r6/README_MASKGIT_RESTART.md'
      - 'snn_transform_r6/archive/maskgit_legacy_d7_d9/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile retained MaskGIT and shared core
        run: |
          set -euo pipefail
          python -m py_compile \
            snn_transform_r6/maskgit_input_representation.py \
            snn_transform_r6/maskgit_msdl_training.py \
            snn_transform_r6/maskgit_msdl_training_unconditional.py \
            snn_transform_r6/maskgit_scheduled_parallel.py \
            snn_transform_r6/r6b1_spiking_tokenizer.py \
            snn_transform_r6/r6b2_snn_encoder_p3_msdl.py \
            snn_transform_r6/r6b3_context_epoch_training.py \
            snn_transform_r6/r6b3_decoder_operating_point_audit.py \
            snn_transform_r6/r6b3_decoder_spatial_refinement_audit.py \
            snn_transform_r6/r6b3_snn_encoder_maskgit_msdl.py \
            snn_transform_r6/r6b4_full_forward_plasticity.py \
            snn_transform_r6/r6b4_full_forward_effectiveness_test.py \
            snn_transform_r6/r6b4_full_forward_plasticity_smoke.py \
            snn_transform_r6/gate_d_d3e_runtime.py \
            snn_transform_r6/gate_d_d6a.py \
            snn_transform_r6/gate_d_d6a1.py \
            snn_transform_r6/gate_d_plasticity_audit.py
          echo 'PY_COMPILE: PASS'

      - name: Audit archive integrity references and change scope
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import json
          import pathlib
          import subprocess

          ROOT = pathlib.Path('.')
          BASE = '2d7439493cfd9fdc0cadd9d2950892dede1804a8'
          SELF = 'snn_transform_maskgit_restart_static_audit.yml'

          original_paths = [
              'snn_transform_r6/GATE_D7A_PROTOCOL.md',
              'snn_transform_r6/GATE_D7A1_PROTOCOL.md',
              'snn_transform_r6/GATE_D7A2_PROTOCOL.md',
              'snn_transform_r6/GATE_D8A_PROTOCOL.md',
              'snn_transform_r6/GATE_D8B_PROTOCOL.md',
              'snn_transform_r6/GATE_D9A_PROTOCOL.md',
              'snn_transform_r6/GATE_D9A1_PROTOCOL.md',
              'snn_transform_r6/GATE_D9A2R_PROTOCOL.md',
              'snn_transform_r6/GATE_D9A3_PROTOCOL.md',
              'snn_transform_r6/gate_d_d7a.py',
              'snn_transform_r6/gate_d_d7a1.py',
              'snn_transform_r6/gate_d_d7a1_same_run_w2.py',
              'snn_transform_r6/gate_d_d7a2.py',
              'snn_transform_r6/gate_d_d8a.py',
              'snn_transform_r6/gate_d_d8a_theta_fix.py',
              'snn_transform_r6/gate_d_d8b.py',
              'snn_transform_r6/gate_d_d9a.py',
              'snn_transform_r6/gate_d_d9a1.py',
              'snn_transform_r6/gate_d_d9a1_compat.py',
              'snn_transform_r6/gate_d_d9a2r.py',
              'snn_transform_r6/gate_d_d9a2r_compat.py',
              'snn_transform_r6/gate_d_d9a3.py',
              'snn_transform_r6/gate_d_d9a_vector_theta_launcher.py',
              '.github/workflows/snn_transform_gate_d_d7a.yml',
              '.github/workflows/snn_transform_gate_d_d7a1.yml',
              '.github/workflows/snn_transform_gate_d_d7a2.yml',
              '.github/workflows/snn_transform_gate_d_d8a.yml',
              '.github/workflows/snn_transform_gate_d_d8b.yml',
              '.github/workflows/snn_transform_gate_d_d9a.yml',
              '.github/workflows/snn_transform_gate_d_d9a1.yml',
              '.github/workflows/snn_transform_gate_d_d9a2r.yml',
              '.github/workflows/snn_transform_gate_d_d9a2r_compat.yml',
              '.github/workflows/snn_transform_gate_d_d9a3.yml',
          ]
          assert len(original_paths) == 33

          for path in original_paths:
              assert not pathlib.Path(path).exists(), f'legacy active path still exists: {path}'
          print('ACTIVE_LEGACY_PATH_REMOVAL: PASS 33/33')

          manifest_path = pathlib.Path('snn_transform_r6/archive/maskgit_legacy_d7_d9/provenance/ARCHIVE_MANIFEST.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          files = manifest['files']
          assert len(files) == 33, len(files)
          for original, archive, expected_sha in files:
              assert original in original_paths, original
              ap = pathlib.Path(archive)
              assert ap.is_file(), archive
              actual_sha = subprocess.check_output(['git', 'hash-object', str(ap)], text=True).strip()
              assert actual_sha == expected_sha, (archive, expected_sha, actual_sha)
          print('ARCHIVE_BLOB_IDENTITY: PASS 33/33')

          removed_mods = {
              'gate_d_d7a', 'gate_d_d7a1', 'gate_d_d7a1_same_run_w2', 'gate_d_d7a2',
              'gate_d_d8a', 'gate_d_d8a_theta_fix', 'gate_d_d8b',
              'gate_d_d9a', 'gate_d_d9a1', 'gate_d_d9a1_compat',
              'gate_d_d9a2r', 'gate_d_d9a2r_compat', 'gate_d_d9a3',
              'gate_d_d9a_vector_theta_launcher',
          }
          bad_imports = []
          for py in pathlib.Path('snn_transform_r6').glob('*.py'):
              tree = ast.parse(py.read_text(encoding='utf-8'), filename=str(py))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      for alias in node.names:
                          top = alias.name.split('.')[0]
                          if top in removed_mods:
                              bad_imports.append((str(py), top))
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      top = node.module.split('.')[0]
                      if top in removed_mods:
                          bad_imports.append((str(py), top))
          assert not bad_imports, bad_imports
          print('ACTIVE_IMPORT_REFERENCES: PASS')

          removed_basenames = {pathlib.Path(p).name for p in original_paths}
          stale_workflow_refs = []
          wfdir = pathlib.Path('.github/workflows')
          workflows = list(wfdir.glob('*.yml')) + list(wfdir.glob('*.yaml'))
          for wf in workflows:
              if wf.name == SELF:
                  continue
              text = wf.read_text(encoding='utf-8')
              for basename in removed_basenames:
                  if basename in text:
                      stale_workflow_refs.append((str(wf), basename))
          assert not stale_workflow_refs, stale_workflow_refs
          print('ACTIVE_WORKFLOW_REFERENCES: PASS')

          required_active = [
              'snn_transform_r6/README_MASKGIT_RESTART.md',
              'snn_transform_r6/maskgit_input_representation.py',
              'snn_transform_r6/maskgit_msdl_training.py',
              'snn_transform_r6/maskgit_msdl_training_unconditional.py',
              'snn_transform_r6/maskgit_scheduled_parallel.py',
              'snn_transform_r6/r6b1_spiking_tokenizer.py',
              'snn_transform_r6/r6b2_snn_encoder_p3_msdl.py',
              'snn_transform_r6/r6b3_context_epoch_training.py',
              'snn_transform_r6/r6b3_snn_encoder_maskgit_msdl.py',
              'snn_transform_r6/r6b3_decoder_operating_point_audit.py',
              'snn_transform_r6/r6b3_decoder_spatial_refinement_audit.py',
              'snn_transform_r6/r6b4_full_forward_plasticity.py',
              'snn_transform_r6/r6b4_full_forward_effectiveness_test.py',
              'snn_transform_r6/r6b4_full_forward_plasticity_smoke.py',
              'snn_transform_r6/gate_d_d3e_runtime.py',
              'snn_transform_r6/gate_d_d6a.py',
              'snn_transform_r6/gate_d_d6a1.py',
              'snn_transform_r6/gate_d_plasticity_audit.py',
              'snn_transform_r6/gate_d_analyze.py',
          ]
          missing = [p for p in required_active if not pathlib.Path(p).is_file()]
          assert not missing, missing
          print('ACTIVE_CORE_PRESENCE: PASS')

          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', f'{BASE}..HEAD'], text=True
          ).splitlines()
          def allowed(path):
              return (
                  path in original_paths
                  or path == 'snn_transform_r6/README_MASKGIT_RESTART.md'
                  or path == '.github/workflows/' + SELF
                  or path.startswith('snn_transform_r6/archive/maskgit_legacy_d7_d9/')
              )
          unexpected = [p for p in changed if not allowed(p)]
          assert not unexpected, unexpected
          print('CHANGE_SCOPE: PASS')

          assert not any('D9A4' in p or 'd9a4' in p for p in changed)
          print('D9A4_ABSENT_UNTOUCHED: PASS')
          print('MASKGIT_RESTART_STATIC_AUDIT: PASS')
          PY

name: SNN Transform R5C Two-Block Recovery

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: 'R5C recovery epochs'
        required: false
        default: '5'
  push:
    branches: [camp4]
    paths:
      - 'snn_transform_r5/RUN_TRIGGER_R5C'

permissions:
  contents: read
  actions: read

jobs:
  r5c_two_block:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: camp4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy torch scikit-learn matplotlib
      - name: Recover B0 checkpoint and codebook from E29
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p snn_transform_r5/run_r5c
          gh run download 38964779791 \
            --repo FangMunan/Tutorial \
            --name SNN_TRANSFORM_E29_FORWARD_EQUIVALENCE \
            --dir snn_transform_r5/run_r5c/e29_source
          test -f snn_transform_r5/run_r5c/e29_source/b0/best.pt
          test -f snn_transform_r5/run_r5c/e29_source/b0/codebook.npy
      - name: Download MNIST
        working-directory: snn_transform_r5
        run: |
          python - <<'PY'
          import urllib.request
          urllib.request.urlretrieve('https://storage.googleapis.com/tensorflow/tf-keras-datasets/mnist.npz','run_r5c/mnist.npz')
          PY
      - name: Static gradient-free audit
        working-directory: snn_transform_r5
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile r5c_two_block_recovery.py
          if grep -nE '\.backward\(|torch\.optim' r5c_two_block_recovery.py; then
            echo 'Forbidden backprop/torch.optim API found'; exit 1
          fi
      - name: Run R5C two-block recovery
        working-directory: snn_transform_r5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run_r5c/result
          E='${{ github.event.inputs.epochs }}'; E=${E:-5}
          python r5c_two_block_recovery.py \
            --data run_r5c/mnist.npz \
            --checkpoint run_r5c/e29_source/b0/best.pt \
            --codebook run_r5c/e29_source/b0/codebook.npy \
            --out run_r5c/result \
            --features 256 \
            --rf-kind p3norm \
            --rf-seed 29257 \
            --epochs "$E" \
            --batch 128 \
            --sigma 0.05 \
            --lr-qkv 0.020 \
            --lr-wo 0.040 \
            --lr-f1 0.055 \
            --lr-f2 0.080 \
            --lr-ln 0.015 \
            --deep-lr-scale 0.65 \
            --clip 0.60 \
            --threads 2 | tee run_r5c/r5c_console.log
      - name: Show R5C metrics
        if: always()
        working-directory: snn_transform_r5
        run: |
          if [ -f run_r5c/result/metrics.json ]; then cat run_r5c/result/metrics.json; fi
      - name: Upload R5C artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SNN_TRANSFORM_R5C_TWO_BLOCK_RECOVERY
          path: |
            snn_transform_r5/run_r5c/result/metrics.json
            snn_transform_r5/run_r5c/result/history.csv
            snn_transform_r5/run_r5c/result/recovery_checkpoint.pt
            snn_transform_r5/run_r5c/result/*.png
            snn_transform_r5/run_r5c/r5c_console.log
          if-no-files-found: warn
          retention-days: 30

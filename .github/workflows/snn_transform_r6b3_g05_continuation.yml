name: SNN Transform R6B3 G0.50 continuation

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  g05:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r6b3-g0-training-v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy torch scikit-learn scipy scikit-image matplotlib numba

      - name: Download frozen R6B1 SNN tokenizer
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_R6B1_TUNE_a075_t8
          path: snn_transform_r6/frozen_r6b1
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39139040624

      - name: Download prior G0 checkpoint artifact
        uses: actions/download-artifact@v4
        with:
          name: SNN_TRANSFORM_R6B3_G0_CONTEXT_EPOCH
          path: snn_transform_r6/prior_g0
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39162890880

      - name: Download MNIST
        working-directory: snn_transform_r6
        run: |
          mkdir -p run_r6b3_g05
          python - <<'PY'
          import urllib.request
          urllib.request.urlretrieve(
              'https://storage.googleapis.com/tensorflow/tf-keras-datasets/mnist.npz',
              'run_r6b3_g05/mnist.npz')
          PY

      - name: Static continuation audit
        working-directory: snn_transform_r6
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile r6b3_context_epoch_training.py
          test -f frozen_r6b1/result/tokenizer.pt
          test -f prior_g0/result/checkpoint_0p2500epoch.pkl
          test -f prior_g0/result/checkpoint_0p2500epoch.inventory.json
          grep -q -- '--resume' r6b3_context_epoch_training.py
          grep -q 'load_full_checkpoint' r6b3_context_epoch_training.py
          grep -q 'checkpoint_roundtrip_audit' r6b3_context_epoch_training.py

      - name: Continue from 0.25 to 0.50 context epoch
        working-directory: snn_transform_r6
        shell: bash
        run: |
          set -euo pipefail
          OUT=run_r6b3_g05/result
          mkdir -p "$OUT"
          python r6b3_context_epoch_training.py \
            --data run_r6b3_g05/mnist.npz \
            --tokenizer frozen_r6b1/result/tokenizer.pt \
            --resume prior_g0/result/checkpoint_0p2500epoch.pkl \
            --out "$OUT" \
            --fractional-epoch 0.25 \
            --D 96 --heads 8 --features 24 --ff 192 --R 7 \
            --scaffold-contexts 2000 --scaffold-paths 2500 --scaffold-lr 0.6 \
            --internal-lr-scale 0.5 \
            --eval-images 128 \
            --gen-samples 36 \
            --choice-temperature 4.5 \
            --encode-batch 256 \
            --report-every-contexts 500 \
            --seed 7311 --threads 4 | tee run_r6b3_g05/console.log

      - name: Show concise continuation result
        if: always()
        working-directory: snn_transform_r6
        run: |
          test -f run_r6b3_g05/result/G0_RESULTS.json && python - <<'PY'
          import json
          d=json.load(open('run_r6b3_g05/result/G0_RESULTS.json'))
          print(json.dumps({
            'meta':d['meta'],
            'primary_comparison':d['primary_comparison'],
            'all_system_arrays_finite':d['all_system_arrays_finite'],
            'checkpoint_roundtrip_pass':d['checkpoint_roundtrip_audit']['pass'],
            'relative_weight_move_this_run':d['relative_weight_move_this_run'],
            'mean_abs_reciprocal':d['mean_abs_reciprocal'],
            'generation_start_8':d['segment_start_evaluation']['generation']['8']['token_stats'],
            'generation_final_8':d['segment_final_evaluation']['generation']['8']['token_stats'],
            'generation_start_16':d['segment_start_evaluation']['generation']['16']['token_stats'],
            'generation_final_16':d['segment_final_evaluation']['generation']['16']['token_stats'],
          },indent=2))
          PY

      - name: Upload G0.50 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SNN_TRANSFORM_R6B3_G050_CONTINUATION
          path: |
            snn_transform_r6/run_r6b3_g05/result/
            snn_transform_r6/run_r6b3_g05/console.log
          if-no-files-found: warn
          retention-days: 30
